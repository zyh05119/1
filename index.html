<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷涩调</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0a0a0a;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            color: #eaeaea;
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-16px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .hero {
            min-height: 40vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 2rem;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            animation: fadeInLeft 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .hero h1 {
            font-size: 2.6rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            color: #ffffff;
            line-height: 1.15;
            margin-bottom: 0.5rem;
        }
        .hero p {
            font-size: 1rem;
            color: #9ca3af;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, transparent, #2e2e2e 15%, #2e2e2e 85%, transparent);
            flex-shrink: 0;
        }

        .links-section {
            flex: 1;
            padding: 2rem;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.6rem;
        }

        .link-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.55rem 0.9rem;
            background: #111111;
            border: 1px solid #1f1f1f;
            border-radius: 8px;
            text-decoration: none;
            color: #d4d4d8;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.15s ease, border-color 0.15s ease,
                        color 0.15s ease, transform 0.15s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0;
        }

        .link-item.is-visible {
            animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: var(--delay, 0s);
        }

        .link-item:hover {
            background: #1a1a1a;
            border-color: #3b82f6;
            color: #ffffff;
            transform: translateY(-1px);
        }

        .link-item:focus-visible {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }

        .link-item .ico {
            font-size: 0.95rem;
            line-height: 1;
            flex-shrink: 0;
            opacity: 0.85;
        }

        .link-item .arrow {
            margin-left: auto;
            font-size: 0.75rem;
            color: #3b82f6;
            opacity: 0;
            transition: opacity 0.15s;
            flex-shrink: 0;
        }
        .link-item:hover .arrow { opacity: 1; }

        .link-item.feedback { border-color: #2a2a2a; }
        .link-item.feedback .ico { opacity: 1; }

        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: #3f3f46;
            padding: 1.5rem 1rem 2rem;
            letter-spacing: 0.5px;
            opacity: 0;
        }
        .footer-note.is-visible {
            animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
        }

        .footer-note a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid transparent;
            transition: border-color 0.15s, color 0.15s;
        }
        .footer-note a:hover {
            color: #93c5fd;
            border-bottom-color: #93c5fd;
        }

        @media (max-width: 600px) {
            .hero { min-height: 35vh; padding: 0 1.25rem; }
            .hero h1 { font-size: 1.9rem; }
            .hero p { font-size: 0.9rem; }
            .links-section { padding: 1.5rem 1.25rem; }
            .links-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 0.5rem;
            }
            .link-item { padding: 0.5rem 0.7rem; font-size: 0.78rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            .hero, .link-item, .footer-note {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
            .link-item { transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease; }
            .link-item:hover { transform: none; }
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>冷涩调</h1>
        <p>你今天想做些什么呢？</p>
    </div>

    <div class="divider"></div>

    <div class="links-section">
        <div class="links-grid">
            <!-- 工具 -->
            <a href="https://base64.shuttlelab.org/" class="link-item" target="_blank" rel="noopener noreferrer">
                <span class="ico" aria-hidden="true">🔐</span>
                <span>Base64 编解码</span>
                <span class="arrow" aria-hidden="true">↗</span>
            </a>

            <!-- 反馈入口 -->
            <a href="about.html#feedback" class="link-item feedback" target="_blank" rel="noopener noreferrer">
                <span class="ico" aria-hidden="true">📮</span>
                <span>意见反馈</span>
                <span class="arrow" aria-hidden="true">↗</span>
            </a>

            <a href="about.html#bug" class="link-item feedback" target="_blank" rel="noopener noreferrer">
                <span class="ico" aria-hidden="true">🐛</span>
                <span>报告问题</span>
                <span class="arrow" aria-hidden="true">↗</span>
            </a>

            <a href="about.html#suggest" class="link-item feedback" target="_blank" rel="noopener noreferrer">
                <span class="ico" aria-hidden="true">💡</span>
                <span>工具建议</span>
                <span class="arrow" aria-hidden="true">↗</span>
            </a>

            <a href="mailto:zyh0197@gmail.com" class="link-item feedback">
                <span class="ico" aria-hidden="true">✉️</span>
                <span>联系作者</span>
                <span class="arrow" aria-hidden="true">↗</span>
            </a>
        </div>
    </div>

    <div class="footer-note">
        如有疑问 请联系 <a href="about.html" target="_blank" rel="noopener noreferrer">冷涩调</a> 本人或管理员进行反馈哦
    </div>

    <script>
    (function () {
        'use strict';

        var items  = Array.prototype.slice.call(document.querySelectorAll('.link-item'));
        var footer = document.querySelector('.footer-note');
        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        items.forEach(function (el, i) {
            el.style.setProperty('--delay', (i * 0.05) + 's');
        });

        function reveal(el) { el.classList.add('is-visible'); }

        if (reduceMotion) {
            items.forEach(reveal);
            footer.classList.add('is-visible');
        } else if ('IntersectionObserver' in window) {
            var io = new IntersectionObserver(function (entries, observer) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        reveal(entry.target);
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
            items.forEach(function (el) { io.observe(el); });

            var footerIO = new IntersectionObserver(function (entries, observer) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        footer.classList.add('is-visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });
            footerIO.observe(footer);
        } else {
            items.forEach(reveal);
            footer.classList.add('is-visible');
        }
    })();
    </script>
</body>
</html>
