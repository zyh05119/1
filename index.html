<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷涩调</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0a0a0a;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            color: #eaeaea;
            display: flex;
            flex-direction: column;
            position: relative;
            opacity: 0;
            animation: fadeInPage 0.8s ease forwards;
            transition: background-color 0.4s ease, color 0.3s ease;
            overflow-x: hidden;
        }

        body.light-mode {
            background-color: #f5f0e6;
            color: #3a3528;
        }

        @keyframes fadeInPage {
            0%   { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.008) 1px, transparent 1px),
                radial-gradient(circle at 70% 60%, rgba(255,255,255,0.006) 1px, transparent 1px),
                radial-gradient(circle at 40% 80%, rgba(255,255,255,0.005) 1px, transparent 1px),
                radial-gradient(circle at 90% 20%, rgba(255,255,255,0.007) 1px, transparent 1px);
            background-size: 200px 200px, 150px 150px, 180px 180px, 220px 220px;
        }
        body.light-mode::after {
            background-image:
                radial-gradient(circle at 20% 30%, rgba(120, 100, 70, 0.025) 1px, transparent 1px),
                radial-gradient(circle at 70% 60%, rgba(120, 100, 70, 0.018) 1px, transparent 1px),
                radial-gradient(circle at 40% 80%, rgba(120, 100, 70, 0.014) 1px, transparent 1px),
                radial-gradient(circle at 90% 20%, rgba(120, 100, 70, 0.020) 1px, transparent 1px);
        }

        .hero {
            min-height: 40vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 2rem;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 320px;
            height: 320px;
            transform: translateY(-50%);
            background: radial-gradient(circle, rgba(59, 130, 246, 0.10), transparent 70%);
            filter: blur(40px);
            pointer-events: none;
            z-index: -1;
            animation: glowPulse 6s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.6; transform: translateY(-50%) scale(1); }
            50%      { opacity: 1;   transform: translateY(-50%) scale(1.15); }
        }

        .hero h1 {
            font-size: 2.6rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            color: #ffffff;
            line-height: 1.15;
            margin-bottom: 0.5rem;
            animation: fadeInLeft 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
            transition: color 0.3s ease;
        }
        .hero p {
            font-size: 1rem;
            color: #9ca3af;
            font-weight: 400;
            letter-spacing: 0.3px;
            animation: fadeInLeft 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
            transition: color 0.3s ease;
        }
        body.light-mode .hero h1 { color: #2a2418; }
        body.light-mode .hero p  { color: #8a7f68; }

        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-16px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, transparent, #2e2e2e 15%, #2e2e2e 85%, transparent);
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }
        body.light-mode .divider {
            background: linear-gradient(to right, transparent, #d8cfba 15%, #d8cfba 85%, transparent);
        }

        .links-section {
            flex: 1;
            padding: 2rem;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.6rem;
        }

        .link-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.55rem 0.9rem;
            background: #111111;
            border: 1px solid #1f1f1f;
            border-radius: 8px;
            text-decoration: none;
            color: #d4d4d8;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: inherit;
            text-align: left;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease,
                        color 0.15s ease, transform 0.15s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0;
        }
        body.light-mode .link-item {
            background: #fbf7ee;
            border-color: #e6ddc9;
            color: #4a4232;
        }

        .link-item.is-visible {
            animation: cardIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: var(--delay, 0s);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(10px) scale(0.94); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .link-item:hover {
            background: #1a1a1a;
            border-color: #3b82f6;
            color: #ffffff;
            transform: translateY(-1px) scale(1.02);
        }
        body.light-mode .link-item:hover {
            background: #fffaf0;
            border-color: #c9a86a;
            color: #2a2418;
        }

        .link-item:active { transform: scale(0.97); }
        .link-item:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }

        .link-item .ico {
            font-size: 0.95rem;
            line-height: 1;
            flex-shrink: 0;
            opacity: 0.85;
        }

        .link-item .arrow {
            margin-left: auto;
            font-size: 0.75rem;
            color: #3b82f6;
            opacity: 0;
            transition: opacity 0.15s;
            flex-shrink: 0;
        }
        body.light-mode .link-item .arrow { color: #c9a86a; }
        .link-item:hover .arrow { opacity: 1; }

        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: #3f3f46;
            padding: 1.5rem 1rem 2rem;
            letter-spacing: 0.5px;
            opacity: 0;
            position: relative;
            z-index: 1;
            transition: color 0.3s ease;
        }
        body.light-mode .footer-note { color: #a89b82; }

        .footer-note.is-visible {
            animation: cardIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
        }

        .footer-note a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid transparent;
            transition: border-color 0.15s, color 0.15s;
        }
        body.light-mode .footer-note a { color: #b8904a; }
        .footer-note a:hover { color: #93c5fd; border-bottom-color: #93c5fd; }
        body.light-mode .footer-note a:hover { color: #9c7a3a; border-bottom-color: #9c7a3a; }

        /* ===== 主题切换 ===== */
        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 100;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(60, 110, 120, 0.08);
            background: rgba(10, 18, 20, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #c8a85a;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .theme-toggle:hover {
            transform: scale(1.05);
            border-color: rgba(200, 180, 100, 0.15);
            background: rgba(10, 18, 20, 0.5);
            box-shadow: 0 0 20px rgba(200, 180, 80, 0.06);
        }
        .theme-toggle:active { transform: scale(0.92); }
        body.light-mode .theme-toggle {
            background: rgba(255, 250, 240, 0.8);
            border-color: rgba(180, 150, 100, 0.25);
            color: #a8863a;
        }

        /* ===== 天气 ===== */
        .weather-corner {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(10, 18, 20, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(60, 110, 120, 0.06);
            border-radius: 30px;
            padding: 6px 16px 6px 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: rgba(200, 220, 225, 0.55);
            letter-spacing: 0.5px;
            user-select: none;
            pointer-events: none;
            white-space: nowrap;
            transition: background 0.3s, border-color 0.3s, color 0.3s;
        }
        body.light-mode .weather-corner {
            background: rgba(255, 250, 240, 0.8);
            border-color: rgba(180, 150, 100, 0.20);
            color: rgba(120, 100, 70, 0.75);
            box-shadow: 0 4px 20px rgba(120, 100, 60, 0.08);
        }
        .weather-corner .w-icon { font-size: 0.9rem; line-height: 1; }
        .weather-corner .w-temp { font-weight: 400; color: rgba(200, 220, 225, 0.7); }
        body.light-mode .weather-corner .w-temp { color: rgba(120, 100, 70, 0.9); }
        .weather-corner .w-city {
            font-size: 0.6rem;
            opacity: 0.55;
            max-width: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== 通用弹窗 ===== */
        .toast-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.25s ease;
        }
        .toast-overlay.show { display: flex; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }

        .toast-box {
            background: rgba(10, 18, 20, 0.95);
            border: 1px solid rgba(60, 110, 120, 0.15);
            border-radius: 24px;
            padding: 32px 36px 28px;
            max-width: 340px;
            width: 85%;
            text-align: center;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
            animation: scaleIn 0.25s ease;
        }
        body.light-mode .toast-box {
            background: rgba(255, 250, 240, 0.98);
            border-color: rgba(180, 150, 100, 0.3);
        }

        .toast-box .emoji {
            font-size: 2.8rem;
            display: block;
            margin-bottom: 12px;
        }
        .toast-box .title {
            font-size: 1.1rem;
            color: #8aa8ac;
            letter-spacing: 1px;
            font-weight: 400;
            margin-bottom: 6px;
        }
        body.light-mode .toast-box .title { color: #4a6a6f; }
        .toast-box .msg {
            font-size: 0.9rem;
            color: rgba(150, 180, 190, 0.75);
            letter-spacing: 0.5px;
            line-height: 1.6;
            margin-bottom: 18px;
        }
        body.light-mode .toast-box .msg { color: #6a5a48; }

        .toast-box .btn-close {
            background: rgba(60, 110, 120, 0.08);
            border: 1px solid rgba(60, 110, 120, 0.15);
            border-radius: 12px;
            padding: 10px 32px;
            color: #c8d8dc;
            font-size: 0.9rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 300;
        }
        .toast-box .btn-close:hover {
            background: rgba(60, 110, 120, 0.15);
            color: #fff;
        }
        body.light-mode .toast-box .btn-close {
            background: rgba(180, 150, 100, 0.1);
            border-color: rgba(180, 150, 100, 0.25);
            color: #6a5a48;
        }
        body.light-mode .toast-box .btn-close:hover {
            background: rgba(180, 150, 100, 0.2);
        }

        /* ===== 鼠标跟随光点 ===== */
        .cursor-dot {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.35);
            box-shadow: 0 0 14px 3px rgba(59, 130, 246, 0.25);
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: opacity 0.4s ease, transform 0.15s ease;
            opacity: 0;
        }
        body.light-mode .cursor-dot {
            background: rgba(184, 144, 74, 0.4);
            box-shadow: 0 0 14px 3px rgba(184, 144, 74, 0.25);
        }

        /* ===== 长按拖尾星星 ===== */
        .star-trail {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            user-select: none;
            -webkit-user-select: none;
            line-height: 1;
            transform: translate(-50%, -50%);
            will-change: transform, opacity;
            animation: starFade 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes starFade {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.3) rotate(90deg);
            }
        }

        /* ===== 点击爆星星 ===== */
        .click-star {
            position: fixed;
            pointer-events: none;
            font-size: 1rem;
            z-index: 9999;
            user-select: none;
            animation: starFloat 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes starFloat {
            0%   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -180%) scale(1.6); }
        }

        @media (max-width: 600px) {
            .hero { min-height: 35vh; padding: 0 1.25rem; }
            .hero h1 { font-size: 1.9rem; }
            .hero p { font-size: 0.9rem; }
            .hero::before { width: 220px; height: 220px; filter: blur(30px); }
            .links-section { padding: 1.5rem 1.25rem; }
            .links-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 0.5rem;
            }
            .link-item { padding: 0.5rem 0.7rem; font-size: 0.78rem; }
            .theme-toggle { top: 12px; right: 12px; width: 32px; height: 32px; font-size: 0.8rem; }
            .weather-corner { bottom: 14px; right: 14px; padding: 5px 12px 5px 10px; font-size: 0.68rem; }
            .toast-box { padding: 26px 22px 22px; }
            .toast-box .emoji { font-size: 2.4rem; }
            .cursor-dot { display: none; }
            .star-trail { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            body, .hero h1, .hero p, .hero::before,
            .link-item, .footer-note {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
            .link-item { transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease; }
            .link-item:hover { transform: none; }
            .link-item:active { transform: none; }
            .cursor-dot { display: none; }
            .star-trail { display: none !important; }
            .click-star { animation: none !important; opacity: 0 !important; }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" id="themeToggle" aria-label="切换黑白模式">✦</button>

    <div class="weather-corner" id="weatherCorner">
        <span class="w-icon" id="weatherIcon">🌤</span>
        <span class="w-temp" id="weatherTemp">--°</span>
        <span class="w-city" id="weatherCity">--</span>
    </div>

    <div class="hero">
        <h1>冷涩调</h1>
        <p>你今天想做些什么呢？</p>
    </div>

    <div class="divider"></div>

    <div class="links-section">
        <div class="links-grid">
            <!-- 工具 -->
            <a href="https://base64.shuttlelab.org/" class="link-item" target="_blank" rel="noopener noreferrer">
                <span class="ico" aria-hidden="true">🔐</span>
                <span>Base64 编解码</span>
                <span class="arrow" aria-hidden="true">↗</span>
            </a>

            <!-- 系统报错 -->
            <a href="feedback.html#bug" class="link-item" target="_blank" rel="noopener noreferrer">
                <span class="ico" aria-hidden="true">🐛</span>
                <span>系统报错</span>
                <span class="arrow" aria-hidden="true">↗</span>
            </a>

            <!-- 今日运势 -->
            <button type="button" class="link-item" id="fortuneBtn">
                <span class="ico" aria-hidden="true">🔮</span>
                <span>今日运势</span>
                <span class="arrow" aria-hidden="true">↗</span>
            </button>

            <!-- 一键写完作业（假的） -->
            <button type="button" class="link-item" id="homeworkBtn">
                <span class="ico" aria-hidden="true">🚀</span>
                <span>一键写完作业</span>
                <span class="arrow" aria-hidden="true">↗</span>
            </button>
        </div>
    </div>

    <div class="footer-note">
        如有疑问 请联系 <a href="about.html" target="_blank" rel="noopener noreferrer">冷涩调</a> 本人或管理员进行反馈哦
    </div>

    <!-- 通用弹窗 -->
    <div class="toast-overlay" id="toastOverlay">
        <div class="toast-box">
            <span class="emoji" id="toastEmoji">🔮</span>
            <div class="title" id="toastTitle">今日运势</div>
            <div class="msg" id="toastMsg">…</div>
            <button class="btn-close" id="toastCloseBtn">知道了</button>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        /* ================= 主题切换 ================= */
        var toggleBtn = document.getElementById('themeToggle');
        var isLight = localStorage.getItem('theme') === 'light';
        if (isLight) {
            document.body.classList.add('light-mode');
            toggleBtn.textContent = '☀';
        }
        toggleBtn.addEventListener('click', function () {
            isLight = !isLight;
            if (isLight) {
                document.body.classList.add('light-mode');
                toggleBtn.textContent = '☀';
                localStorage.setItem('theme', 'light');
            } else {
                document.body.classList.remove('light-mode');
                toggleBtn.textContent = '✦';
                localStorage.setItem('theme', 'dark');
            }
        });

        /* ================= 天气 ================= */
        function getWeather() {
            var tempEl = document.getElementById('weatherTemp');
            var cityEl = document.getElementById('weatherCity');
            var iconEl = document.getElementById('weatherIcon');
            if (!tempEl || !cityEl || !iconEl) return;

            var controller = new AbortController();
            var timeoutId = setTimeout(function () { controller.abort(); }, 6000);

            fetch('https://wttr.in?format=j1&lang=zh', { signal: controller.signal })
                .then(function (res) {
                    clearTimeout(timeoutId);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function (data) {
                    var current = data.current_condition && data.current_condition[0];
                    if (!current) return;
                    var temp = current.temp_C;
                    var code = current.weatherCode;
                    var city = (data.nearest_area && data.nearest_area[0] &&
                                data.nearest_area[0].areaName &&
                                data.nearest_area[0].areaName[0].value) || '--';
                    var iconMap = {
                        '113': '☀️', '116': '🌤', '119': '⛅', '122': '☁️',
                        '143': '🌫', '176': '🌦', '179': '🌨', '182': '🌧',
                        '185': '🌧', '200': '⛈', '227': '❄️', '230': '❄️',
                        '248': '🌫', '260': '🌫', '263': '🌦', '266': '🌧',
                        '281': '🌧', '284': '🌧', '293': '🌦', '296': '🌧',
                        '299': '🌧', '302': '🌧', '305': '🌧', '308': '🌧',
                        '311': '🌧', '314': '🌧', '317': '🌧', '320': '🌨',
                        '323': '🌨', '326': '🌨', '329': '🌨', '332': '❄️',
                        '335': '❄️', '338': '❄️', '350': '🌧', '353': '🌦',
                        '356': '🌧', '359': '🌧', '362': '🌧', '365': '🌧',
                        '368': '🌨', '371': '🌨', '374': '🌧', '377': '🌧',
                        '386': '⛈', '389': '⛈', '392': '🌨', '395': '❄️'
                    };
                    iconEl.textContent = iconMap[code] || '🌤';
                    tempEl.textContent = temp + '°';
                    cityEl.textContent = city.length > 6 ? city.slice(0, 6) : city;
                })
                .catch(function () { clearTimeout(timeoutId); });
        }
        getWeather();

        /* ================= 通用弹窗 ================= */
        var overlay = document.getElementById('toastOverlay');
        var toastEmoji = document.getElementById('toastEmoji');
        var toastTitle = document.getElementById('toastTitle');
        var toastMsg = document.getElementById('toastMsg');
        var toastCloseBtn = document.getElementById('toastCloseBtn');

        function showToast(emoji, title, msg) {
            toastEmoji.textContent = emoji;
            toastTitle.textContent = title;
            toastMsg.textContent = msg;
            overlay.classList.add('show');
        }
        function hideToast() { overlay.classList.remove('show'); }

        toastCloseBtn.addEventListener('click', hideToast);
        overlay.addEventListener('click', function (e) {
            if (e.target === overlay) hideToast();
        });

        /* ================= 今日运势 ================= */
        var fortunes = [
            { emoji: '🌟', title: '大吉', msg: '今天适合摸鱼，作业会自己写完的。' },
            { emoji: '✨', title: '中吉', msg: '老师今天心情不错，可以试试问问题。' },
            { emoji: '🍀', title: '小吉', msg: '会有人请你喝奶茶（大概）。' },
            { emoji: '🌙', title: '平', msg: '普普通通的一天，摸就完了。' },
            { emoji: '🌧', title: '小凶', msg: '别忘带作业，真的。' },
            { emoji: '💀', title: '大凶', msg: '建议请假，或者装病。' },
            { emoji: '🎁', title: '惊喜', msg: '今天会有好事发生，信我。' }
        ];

        document.getElementById('fortuneBtn').addEventListener('click', function (e) {
            e.preventDefault();
            // 用日期做种子，同一天结果固定
            var d = new Date();
            var seed = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
            var idx = seed % fortunes.length;
            var f = fortunes[idx];
            showToast(f.emoji, '今日运势 · ' + f.title, f.msg);
        });

        /* ================= 一键写完作业（假的） ================= */
        document.getElementById('homeworkBtn').addEventListener('click', function (e) {
            e.preventDefault();
            showToast('🚀', '启动失败', '作业引擎正在开发中……（其实永远不会开发）');
        });

        /* ================= 鼠标跟随光点 ================= */
        var dot = document.createElement('div');
        dot.className = 'cursor-dot';
        document.body.appendChild(dot);

        var hasPointer = window.matchMedia('(pointer: fine)').matches;
        if (hasPointer) {
            document.addEventListener('mousemove', function (e) {
                dot.style.left = e.clientX + 'px';
                dot.style.top = e.clientY + 'px';
                dot.style.opacity = '1';
            });
            document.addEventListener('mouseleave', function () {
                dot.style.opacity = '0';
            });
        } else {
            dot.style.display = 'none';
        }

        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        /* ================= 长按鼠标 → 连续爆星星拖尾 ================= */
        (function () {
            if (reduceMotion) return;
            if (!hasPointer) return;

            var starChars = ['✦', '✧', '★', '✶', '✷', '✨', '⭐', '💫', '🌟'];

            var isDown = false;
            var lastX = 0, lastY = 0;
            var lastTime = 0;

            var MIN_DIST = 10;
            var MIN_INTERVAL = 30;

            function spawnStar(x, y) {
                var star = document.createElement('span');
                star.className = 'star-trail';
                star.textContent = starChars[Math.floor(Math.random() * starChars.length)];

                if (document.body.classList.contains('light-mode')) {
                    star.style.color = '#c9a86a';
                    star.style.textShadow = '0 0 6px rgba(184,144,74,0.6)';
                } else {
                    star.style.color = '#60a5fa';
                    star.style.textShadow = '0 0 6px rgba(59,130,246,0.6)';
                }

                var size = 0.8 + Math.random() * 0.7;
                star.style.fontSize = size + 'rem';

                var ox = (Math.random() - 0.5) * 12;
                var oy = (Math.random() - 0.5) * 12;
                star.style.left = (x + ox) + 'px';
                star.style.top  = (y + oy) + 'px';

                document.body.appendChild(star);
                setTimeout(function () { star.remove(); }, 1000);
            }

            document.addEventListener('mousedown', function (e) {
                if (e.button !== 0) return;
                isDown = true;
                lastX = e.clientX;
                lastY = e.clientY;
                lastTime = Date.now();
                spawnStar(e.clientX, e.clientY);
            });

            document.addEventListener('mouseup', function () {
                isDown = false;
            });

            document.addEventListener('mousemove', function (e) {
                if (!isDown) return;

                var now = Date.now();
                var x = e.clientX, y = e.clientY;
                var dx = x - lastX;
                var dy = y - lastY;
                var dist = Math.sqrt(dx * dx + dy * dy);

                if (dist >= MIN_DIST && (now - lastTime) >= MIN_INTERVAL) {
                    spawnStar(x, y);
                    lastX = x;
                    lastY = y;
                    lastTime = now;
                }
            });

            document.addEventListener('mouseleave', function () {
                isDown = false;
            });
        })();

        /* ================= 点击爆星星 ================= */
        var clickStarChars = ['✨', '⭐', '💫', '🌟', '✦'];

        document.addEventListener('click', function (e) {
            if (reduceMotion) return;
            // 点在卡片或按钮上不触发，避免干扰
            if (e.target.closest('a, button, input, textarea')) return;

            var star = document.createElement('span');
            star.className = 'click-star';
            star.textContent = clickStarChars[Math.floor(Math.random() * clickStarChars.length)];
            star.style.left = e.clientX + 'px';
            star.style.top = e.clientY + 'px';
            document.body.appendChild(star);
            setTimeout(function () { star.remove(); }, 900);
        });

        /* ================= 卡片入场 ================= */
        var items  = Array.prototype.slice.call(document.querySelectorAll('.link-item'));
        var footer = document.querySelector('.footer-note');

        items.forEach(function (el, i) {        items.forEach(function (el, i) {
            el.style.setProperty('--delay', (i * 0.06) + 's');
        });

        if ('IntersectionObserver' in window) {
            var io = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        io.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });

            items.forEach(function (el) { io.observe(el); });
            if (footer) io.observe(footer);
        } else {
            items.forEach(function (el) { el.classList.add('is-visible'); });
            if (footer) footer.classList.add('is-visible');
        }

    })();
    </script>
</body>
</html>
