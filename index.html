<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>67</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            color: #eaeaea;
            display: flex;
            flex-direction: column;
        }

        .hero {
            min-height: 40vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 2rem;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 2.6rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            color: #ffffff;
            line-height: 1.15;
            margin-bottom: 0.5rem;
        }

        .hero p {
            font-size: 1rem;
            color: #9ca3af;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, transparent, #2e2e2e 15%, #2e2e2e 85%, transparent);
            flex-shrink: 0;
        }

        .links-section {
            flex: 1;
            padding: 2rem;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.6rem;
        }

        .link-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.55rem 0.9rem;
            background: #111111;
            border: 1px solid #1f1f1f;
            border-radius: 8px;
            text-decoration: none;
            color: #d4d4d8;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.15s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .link-item:hover {
            background: #1a1a1a;
            border-color: #3b82f6;
            color: #ffffff;
            transform: translateY(-1px);
        }

        .link-item .ico {
            font-size: 0.95rem;
            line-height: 1;
            flex-shrink: 0;
            opacity: 0.85;
        }

        .link-item .arrow {
            margin-left: auto;
            font-size: 0.75rem;
            color: #3b82f6;
            opacity: 0;
            transition: opacity 0.15s;
            flex-shrink: 0;
        }

        .link-item:hover .arrow {
            opacity: 1;
        }

        .link-item.empty {
            border-style: dashed;
            border-color: #232323;
            color: #6b7280;
        }

        .link-item.empty:hover {
            border-color: #3b82f6;
            color: #a1a1aa;
        }

        .link-item.empty .arrow {
            color: #4b5563;
        }

        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: #3f3f46;
            padding: 1.5rem 1rem 2rem;
            letter-spacing: 0.5px;
        }

        .footer-note a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid transparent;
            transition: border-color 0.15s, color 0.15s;
        }

        .footer-note a:hover {
            color: #93c5fd;
            border-bottom-color: #93c5fd;
        }

        @media (max-width: 600px) {
            .hero {
                min-height: 35vh;
                padding: 0 1.25rem;
            }
            .hero h1 {
                font-size: 1.9rem;
            }
            .hero p {
                font-size: 0.9rem;
            }
            .links-section {
                padding: 1.5rem 1.25rem;
            }
            .links-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 0.5rem;
            }
            .link-item {
                padding: 0.5rem 0.7rem;
                font-size: 0.78rem;
            }
        }
    </style>
</head>
