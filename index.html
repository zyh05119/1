<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷涩调</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0a0a0a;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            color: #eaeaea;
            display: flex;
            flex-direction: column;
            position: relative;
            opacity: 0;
            animation: fadeInPage 0.8s ease forwards;
            transition: background-color 0.4s ease, color 0.3s ease;
            overflow-x: hidden;
        }

        body.light-mode {
            background-color: #f5f0e6;
            color: #3a3528;
        }

        @keyframes fadeInPage {
            0%   { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.008) 1px, transparent 1px),
                radial-gradient(circle at 70% 60%, rgba(255,255,255,0.006) 1px, transparent 1px),
                radial-gradient(circle at 40% 80%, rgba(255,255,255,0.005) 1px, transparent 1px),
                radial-gradient(circle at 90% 20%, rgba(255,255,255,0.007) 1px, transparent 1px);
            background-size: 200px 200px, 150px 150px, 180px 180px, 220px 220px;
        }
        body.light-mode::after {
            background-image:
                radial-gradient(circle at 20% 30%, rgba(120, 100, 70, 0.025) 1px, transparent 1px),
                radial-gradient(circle at 70% 60%, rgba(120, 100, 70, 0.018) 1px, transparent 1px),
                radial-gradient(circle at 40% 80%, rgba(120, 100, 70, 0.014) 1px, transparent 1px),
                radial-gradient(circle at 90% 20%, rgba(120, 100, 70, 0.020) 1px, transparent 1px);
        }

        .hero {
            min-height: 40vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 2rem;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 320px;
            height: 320px;
            transform: translateY(-50%);
            background: radial-gradient(circle, rgba(59, 130, 246, 0.10), transparent 70%);
            filter: blur(40px);
            pointer-events: none;
            z-index: -1;
            animation: glowPulse 6s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.6; transform: translateY(-50%) scale(1); }
            50%      { opacity: 1;   transform: translateY(-50%) scale(1.15); }
        }

        .hero h1 {
            font-size: 2.6rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            color: #ffffff;
            line-height: 1.15;
            margin-bottom: 0.5rem;
            animation: fadeInLeft 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
            transition: color 0.3s ease;
        }
        .hero p {
            font-size: 1rem;
            color: #9ca3af;
            font-weight: 400;
            letter-spacing: 0.3px;
            animation: fadeInLeft 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
            transition: color 0.3s ease;
        }
        body.light-mode .hero h1 { color: #2a2418; }
        body.light-mode .hero p  { color: #8a7f68; }

        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-16px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, transparent, #2e2e2e 15%, #2e2e2e 85%, transparent);
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }
        body.light-mode .divider {
            background: linear-gradient(to right, transparent, #d8cfba 15%, #d8cfba 85%, transparent);
        }

        .links-section {
            flex: 1;
            padding: 2rem;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.6rem;
        }

        .link-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.55rem 0.9rem;
            background: #111111;
            border: 1px solid #1f1f1f;
            border-radius: 8px;
            text-decoration: none;
            color: #d4d4d8;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            width: 100%;
            min-width: 0;
            transition: background 0.15s ease, border-color 0.15s ease,
                        color 0.15s ease, transform 0.15s ease;
            overflow: hidden;
            opacity: 0;
        }
        body.light-mode .link-item {
            background: #fbf7ee;
            border-color: #e6ddc9;
            color: #4a4232;
        }

        .link-item.is-visible {
            animation: cardIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: var(--delay, 0s);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(10px) scale(0.94); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .link-item:hover {
            background: #1a1a1a;
            border-color: #3b82f6;
            color: #ffffff;
            transform: translateY(-1px) scale(1.02);
        }
        body.light-mode .link-item:hover {
            background: #fffaf0;
            border-color: #c9a86a;
            color: #2a2418;
        }

        .link-item:active { transform: scale(0.97); }
        .link-item:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }

        .link-item .ico {
            font-size: 0.95rem;
            line-height: 1;
            flex-shrink: 0;
            opacity: 0.85;
        }

        .link-item .label {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .link-item .arrow {
            margin-left: auto;
            font-size: 0.75rem;
            color: #3b82f6;
            opacity: 0;
            transition: opacity 0.15s;
            flex-shrink: 0;
        }
        body.light-mode .link-item .arrow { color: #c9a86a; }
        .link-item:hover .arrow,
        .link-item:focus-visible .arrow { opacity: 1; }

        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: #71717a;
            padding: 1.5rem 1rem 2rem;
            letter-spacing: 0.5px;
            opacity: 0;
            position: relative;
            z-index: 1;
            transition: color 0.3s ease;
        }
        body.light-mode .footer-note { color: #8a7f68; }

        .footer-note.is-visible {
            animation: cardIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
        }

        .footer-note a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid transparent;
            transition: border-color 0.15s, color 0.15s;
        }
        body.light-mode .footer-note a { color: #b8904a; }
        .footer-note a:hover { color: #93c5fd; border-bottom-color: #93c5fd; }
        body.light-mode .footer-note a:hover { color: #9c7a3a; border-bottom-color: #9c7a3a; }

        /* ===== 主题切换 ===== */
        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 100;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(60, 110, 120, 0.08);
            background: rgba(10, 18, 20, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #c8a85a;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .theme-toggle:hover {
            transform: scale(1.05);
            border-color: rgba(200, 180, 100, 0.15);
            background: rgba(10, 18, 20, 0.5);
            box-shadow: 0 0 20px rgba(200, 180, 80, 0.06);
        }
        .theme-toggle:active { transform: scale(0.92); }
        .theme-toggle:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }
        body.light-mode .theme-toggle {
            background: rgba(255, 250, 240, 0.8);
            border-color: rgba(180, 150, 100, 0.25);
            color: #a8863a;
        }

        /* ===== 语言切换 ===== */
        .lang-toggle {
            right: 60px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            font-family: inherit;
        }

        /* ===== 天气 ===== */
        .weather-corner {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(10, 18, 20, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(60, 110, 120, 0.06);
            border-radius: 30px;
            padding: 6px 16px 6px 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: rgba(200, 220, 225, 0.55);
            letter-spacing: 0.5px;
            user-select: none;
            pointer-events: none;
            white-space: nowrap;
            transition: background 0.3s, border-color 0.3s, color 0.3s;
        }
        body.light-mode .weather-corner {
            background: rgba(255, 250, 240, 0.8);
            border-color: rgba(180, 150, 100, 0.20);
            color: rgba(120, 100, 70, 0.75);
            box-shadow: 0 4px 20px rgba(120, 100, 60, 0.08);
        }
        .weather-corner .w-icon { font-size: 0.9rem; line-height: 1; }
        .weather-corner .w-temp { font-weight: 400; color: rgba(200, 220, 225, 0.7); }
        body.light-mode .weather-corner .w-temp { color: rgba(120, 100, 70, 0.9); }
        .weather-corner .w-city {
            font-size: 0.6rem;
            opacity: 0.55;
            max-width: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== 通用弹窗 ===== */
        .toast-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.25s ease;
        }
        .toast-overlay.show { display: flex; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }

        .toast-box {
            background: rgba(10, 18, 20, 0.95);
            border: 1px solid rgba(60, 110, 120, 0.15);
            border-radius: 24px;
            padding: 32px 36px 28px;
            max-width: 340px;
            width: 85%;
            text-align: center;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
            animation: scaleIn 0.25s ease;
        }
        body.light-mode .toast-box {
            background: rgba(255, 250, 240, 0.98);
            border-color: rgba(180, 150, 100, 0.3);
        }

        .toast-box .emoji {
            font-size: 2.8rem;
            display: block;
            margin-bottom: 12px;
        }
        .toast-box .title {
            font-size: 1.1rem;
            color: #8aa8ac;
            letter-spacing: 1px;
            font-weight: 400;
            margin-bottom: 6px;
        }
        body.light-mode .toast-box .title { color: #4a6a6f; }
        .toast-box .msg {
            font-size: 0.9rem;
            color: rgba(150, 180, 190, 0.75);
            letter-spacing: 0.5px;
            line-height: 1.6;
            margin-bottom: 18px;
        }
        body.light-mode .toast-box .msg { color: #6a5a48; }

        .toast-box .btn-close {
            background: rgba(60, 110, 120, 0.08);
            border: 1px solid rgba(60, 110, 120, 0.15);
            border-radius: 12px;
            padding: 10px 32px;
            color: #c8d8dc;
            font-size: 0.9rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 300;
        }
        .toast-box .btn-close:hover {
            background: rgba(60, 110, 120, 0.15);
            color: #fff;
        }
        .toast-box .btn-close:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }
        body.light-mode .toast-box .btn-close {
            background: rgba(180, 150, 100, 0.1);
            border-color: rgba(180, 150, 100, 0.25);
            color: #6a5a48;
        }
        body.light-mode .toast-box .btn-close:hover {
            background: rgba(180, 150, 100, 0.2);
        }

        /* ===== 倒计时设置 ===== */
        .cd-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        .cd-form input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(60, 110, 120, 0.2);
            background: rgba(60, 110, 120, 0.06);
            color: #c8d8dc;
            font-family: inherit;
            font-size: 0.9rem;
            color-scheme: dark;
            outline: none;
            transition: border-color 0.2s;
        }
        .cd-form input:focus { border-color: #3b82f6; }
        body.light-mode .cd-form input {
            border-color: rgba(180, 150, 100, 0.3);
            background: rgba(180, 150, 100, 0.08);
            color: #4a4232;
            color-scheme: light;
        }
        body.light-mode .cd-form input:focus { border-color: #c9a86a; }
        .cd-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .cd-actions .btn-close {
            flex: 1;
            padding: 10px 14px;
            letter-spacing: 1px;
        }

        /* ===== 随机数设置 ===== */
        .rn-result {
            font-size: 2.4rem;
            font-weight: 300;
            letter-spacing: 1px;
            color: #c8d8dc;
            margin-bottom: 6px;
            min-height: 2.9rem;
            word-break: break-all;
        }
        body.light-mode .rn-result { color: #4a4232; }
        .cd-form .rn-row {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(150, 180, 190, 0.75);
            font-size: 0.85rem;
        }
        body.light-mode .cd-form .rn-row { color: #6a5a48; }
        .cd-form .rn-row input { flex: 1; min-width: 0; text-align: center; }

        /* ===== 石头剪刀布 ===== */
        .rps-score {
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            color: rgba(150, 180, 190, 0.6);
            margin-bottom: 16px;
        }
        body.light-mode .rps-score { color: #8a7f68; }
        .rps-choices {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 16px;
        }
        .rps-choices[hidden] { display: none; }
        .rps-choices button {
            flex: 1;
            font-size: 1.8rem;
            line-height: 1;
            padding: 12px 0;
            border-radius: 12px;
            border: 1px solid rgba(60, 110, 120, 0.2);
            background: rgba(60, 110, 120, 0.06);
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, transform 0.15s;
        }
        .rps-choices button:hover {
            background: rgba(60, 110, 120, 0.15);
            border-color: #3b82f6;
            transform: translateY(-1px);
        }
        .rps-choices button:active { transform: scale(0.94); }
        .rps-choices button:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }
        body.light-mode .rps-choices button {
            border-color: rgba(180, 150, 100, 0.3);
            background: rgba(180, 150, 100, 0.08);
        }
        body.light-mode .rps-choices button:hover {
            background: rgba(180, 150, 100, 0.18);
            border-color: #c9a86a;
        }

        /* ===== 贪吃蛇 ===== */
        .toast-box.snake-box {
            max-width: 380px;
            padding: 22px 22px 20px;
            max-height: 96vh;
            overflow-y: auto;
        }
        .snake-box .title { margin-bottom: 10px; }
        .snake-score {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            color: rgba(150, 180, 190, 0.75);
            margin-bottom: 10px;
        }
        body.light-mode .snake-score { color: #6a5a48; }
        .snake-canvas {
            display: block;
            width: 100%;
            max-width: 340px;
            height: auto;
            aspect-ratio: 1;
            margin: 0 auto 10px;
            border-radius: 12px;
            border: 1px solid rgba(60, 110, 120, 0.2);
            touch-action: none;
        }
        body.light-mode .snake-canvas { border-color: rgba(180, 150, 100, 0.3); }
        .snake-hint {
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            line-height: 1.5;
            color: rgba(150, 180, 190, 0.6);
            margin-bottom: 14px;
        }
        body.light-mode .snake-hint { color: #8a7f68; }
        .snake-pad {
            display: none;
            grid-template-columns: repeat(3, 52px);
            grid-template-rows: repeat(2, 44px);
            gap: 6px;
            justify-content: center;
            margin-bottom: 14px;
        }
        @media (pointer: coarse) { .snake-pad { display: grid; } }
        .snake-pad button {
            border-radius: 12px;
            border: 1px solid rgba(60, 110, 120, 0.2);
            background: rgba(60, 110, 120, 0.06);
            color: #c8d8dc;
            font-size: 1.1rem;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .snake-pad button:active { background: rgba(60, 110, 120, 0.2); }
        body.light-mode .snake-pad button {
            border-color: rgba(180, 150, 100, 0.3);
            background: rgba(180, 150, 100, 0.08);
            color: #4a4232;
        }
        .snake-pad [data-d="up"]    { grid-column: 2; grid-row: 1; }
        .snake-pad [data-d="left"]  { grid-column: 1; grid-row: 2; }
        .snake-pad [data-d="down"]  { grid-column: 2; grid-row: 2; }
        .snake-pad [data-d="right"] { grid-column: 3; grid-row: 2; }

        /* ===== 井字棋 ===== */
        .toast-box .ttt-status { margin-bottom: 12px; min-height: 1.4em; }
        .ttt-mode {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .ttt-mode button {
            flex: 1;
            padding: 8px 0;
            border-radius: 12px;
            border: 1px solid rgba(60, 110, 120, 0.2);
            background: rgba(60, 110, 120, 0.06);
            color: #c8d8dc;
            font-family: inherit;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .ttt-mode button.on {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.15);
        }
        .ttt-mode button:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }
        body.light-mode .ttt-mode button {
            border-color: rgba(180, 150, 100, 0.3);
            background: rgba(180, 150, 100, 0.08);
            color: #4a4232;
        }
        body.light-mode .ttt-mode button.on {
            border-color: #c9a86a;
            background: rgba(201, 168, 106, 0.25);
        }
        .ttt-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 240px;
            margin: 0 auto 14px;
        }
        .ttt-cell {
            aspect-ratio: 1;
            border-radius: 12px;
            border: 1px solid rgba(60, 110, 120, 0.2);
            background: rgba(60, 110, 120, 0.06);
            color: #c8d8dc;
            font-family: inherit;
            font-size: 2rem;
            font-weight: 300;
            line-height: 1;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, transform 0.15s;
        }
        .ttt-cell:disabled { cursor: default; }
        .ttt-cell:hover:not(:disabled) {
            background: rgba(60, 110, 120, 0.15);
            border-color: #3b82f6;
        }
        .ttt-cell:active:not(:disabled) { transform: scale(0.94); }
        .ttt-cell:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }
        .ttt-cell.x { color: #60a5fa; }
        .ttt-cell.o { color: #c8a85a; }
        .ttt-cell.win { border-color: #3b82f6; background: rgba(59, 130, 246, 0.2); }
        body.light-mode .ttt-cell {
            border-color: rgba(180, 150, 100, 0.3);
            background: rgba(180, 150, 100, 0.08);
            color: #4a4232;
        }
        body.light-mode .ttt-cell:hover:not(:disabled) {
            background: rgba(180, 150, 100, 0.18);
            border-color: #c9a86a;
        }
        body.light-mode .ttt-cell.x { color: #9c7a3a; }
        body.light-mode .ttt-cell.o { color: #5b7f85; }
        body.light-mode .ttt-cell.win { border-color: #c9a86a; background: rgba(201, 168, 106, 0.3); }

        /* ===== 鼠标跟随光点 ===== */
        .cursor-dot {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.35);
            box-shadow: 0 0 14px 3px rgba(59, 130, 246, 0.25);
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: opacity 0.4s ease, transform 0.15s ease;
            opacity: 0;
        }
        body.light-mode .cursor-dot {
            background: rgba(184, 144, 74, 0.4);
            box-shadow: 0 0 14px 3px rgba(184, 144, 74, 0.25);
        }

        /* ===== 长按拖尾星星 ===== */
        .star-trail {
            position: fixed;
            pointer-events: none;

        var TTT_LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];

        /* 返回 { mark, line } 或 null */
        function tttCheck(board) {
            for (var i = 0; i < TTT_LINES.length; i++) {
                var L = TTT_LINES[i];
                if (board[L[0]] && board[L[0]] === board[L[1]] && board[L[0]] === board[L[2]]) {
                    return { mark: board[L[0]], line: L };
                }
            }
            return null;
        }

        /* 某一方再下一步就能赢的位置,没有则返回 -1 */
        function tttWinMove(board, mark) {
            for (var i = 0; i < TTT_LINES.length; i++) {
                var L = TTT_LINES[i];
                var cnt = 0, empty = -1;
                for (var j = 0; j < 3; j++) {
                    if (board[L[j]] === mark) cnt++;
                    else if (!board[L[j]]) empty = L[j];
                }
                if (cnt === 2 && empty >= 0) return empty;
            }
            return -1;
        }

        /* 机器人(O):能赢就赢 → 要输就堵 → 中心 → 角 → 随机。不是无敌的,有机会赢它。 */
        function tttBotChoose(board) {
            var m = tttWinMove(board, 'O');
            if (m >= 0) return m;
            m = tttWinMove(board, 'X');
            if (m >= 0) return m;
            if (!board[4]) return 4;
            var corners = [0, 2, 6, 8].filter(function (i) { return !board[i]; });
            if (corners.length) return corners[randInt(0, corners.length - 1)];
            var rest = [];
            for (var i = 0; i < 9; i++) if (!board[i]) rest.push(i);
            return rest[randInt(0, rest.length - 1)];
        }

            var nm = tttNames();
            var winKeys = tttMode === 'duo' ? ['rps_win_p1', 'rps_win_p2'] : ['rps_win_you', 'rps_win_bot'];
            var botTurn = tttMode === 'bot' && tttTurn === 'O';
            var i, mark, cell;

            for (i = 0; i < 9; i++) {
                mark = tttBoard[i] || '';
                cell = tttCells[i];
                cell.textContent = mark;
                cell.className = 'ttt-cell' + (mark === 'X' ? ' x' : mark === 'O' ? ' o' : '') +
                                 (tttWinLine && tttWinLine.indexOf(i) > -1 ? ' win' : '');
                cell.disabled = !!mark || tttOver || botTurn;
                cell.setAttribute('aria-label',
                    mark ? t('ttt_cell_marked', { n: i + 1, mark: mark }) : t('ttt_cell', { n: i + 1 }));
            }

            if (tttOver) {
                tttStatusEl.textContent = tttResult === 'D' ? t('rps_draw')
                                        : t(winKeys[tttResult === 'X' ? 0 : 1]);
            } else {
                tttStatusEl.textContent = t('ttt_turn', { name: tttTurn === 'X' ? nm[0] : nm[1], mark: tttTurn });
            }

            var sc = tttScores[tttMode];
            tttScoreEl.textContent = t('rps_score', { a: nm[0], x: sc.x, y: sc.o, b: nm[1], d: sc.d });

            tttModeBtns.forEach(function (btn) {
                var on = btn.getAttribute('data-mode') === tttMode;
                btn.classList.toggle('on', on);
                btn.setAttribute('aria-pressed', on ? 'true' : 'false');

        function tttScheduleBot() {
            if (tttMode !== 'bot' || tttTurn !== 'O' || tttOver) return;
            tttTimer = setTimeout(function () {
                tttTimer = null;

        function tttPlace(i) {
            var sc = tttScores[tttMode];

            if (w) {
                tttOver = true;
                tttWinLine = w.line;
                tttResult = w.mark;

                tttResult = 'D';
                sc.d++;

            renderTtt();

        var snakeBest = parseInt(safeGet('snakeBest'), 10) || 0;
        var snakeTimer = null;
        var snakeEndKey = 'snake_over';

        (function initSnakeCanvas() {
            var dpr = window.devicePixelRatio || 1;
            var size = SNAKE_GRID * SNAKE_CELL;
            snakeCanvas.width = size * dpr;
            snakeCanvas.height = size * dpr;
            snakeCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        })();

        function snakeRoundRect(x, y, w, h, r) {
            snakeCtx.beginPath();
            snakeCtx.moveTo(x + r, y);
            snakeCtx.arcTo(x + w, y, x + w, y + h, r);
            snakeCtx.arcTo(x + w, y + h, x, y + h, r);
            snakeCtx.arcTo(x, y + h, x, y, r);
            snakeCtx.arcTo(x, y, x + w, y, r);
            snakeCtx.closePath();
            snakeCtx.fill();
        }

        function drawSnake() {
            var light = document.body.classList.contains('light-mode');
            var c = light
                ? { bg: '#fbf7ee', grid: 'rgba(120,100,70,0.08)', body: '#c9a86a', head: '#9c7a3a',
                    food: '#c0583f', text: '#4a4232', mask: 'rgba(251,247,238,0.78)' }
                : { bg: '#0c1214', grid: 'rgba(255,255,255,0.04)', body: '#3b82f6', head: '#93c5fd',
                    food: '#f87171', text: '#eaeaea', mask: 'rgba(10,18,20,0.72)' };
            var size = SNAKE_GRID * SNAKE_CELL;
            var i;

            snakeCtx.fillStyle = c.bg;
            snakeCtx.fillRect(0, 0, size, size);

            snakeCtx.strokeStyle = c.grid;
            snakeCtx.lineWidth = 1;
            for (i = 1; i < SNAKE_GRID; i++) {
                snakeCtx.beginPath();
                snakeCtx.moveTo(i * SNAKE_CELL, 0);
                snakeCtx.lineTo(i * SNAKE_CELL, size);
                snakeCtx.moveTo(0, i * SNAKE_CELL);
                snakeCtx.lineTo(size, i * SNAKE_CELL);
                snakeCtx.stroke();
            }

            snakeCtx.fillStyle = c.food;
            snakeCtx.beginPath();
            snakeCtx.arc((snakeFood.x + 0.5) * SNAKE_CELL, (snakeFood.y + 0.5) * SNAKE_CELL,
                         SNAKE_CELL * 0.34, 0, Math.PI * 2);
            snakeCtx.fill();

            for (i = snake.length - 1; i >= 0; i--) {
                snakeCtx.fillStyle = i === 0 ? c.head : c.body;
                snakeRoundRect(snake[i].x * SNAKE_CELL + 1, snake[i].y * SNAKE_CELL + 1,
                               SNAKE_CELL - 2, SNAKE_CELL - 2, 5);
            }

            if (snakeState !== 'running') {
                var text = snakeState === 'idle' ? t('snake_idle')
                         : snakeState === 'paused' ? t('snake_paused')
                         : t(snakeEndKey) + t('snake_score_suffix', { n: snakeScoreVal });
                snakeCtx.fillStyle = c.mask;
                snakeCtx.fillRect(0, 0, size, size);
                snakeCtx.fillStyle = c.text;
                snakeCtx.font = '600 16px system-ui, sans-serif';
                snakeCtx.textAlign = 'center';
                snakeCtx.textBaseline = 'middle';
                snakeCtx.fillText(text, size / 2, size / 2);
            }
        }

        function updateSnakeUI() {
            snakeScoreEl.textContent = t('snake_score', { n: snakeScoreVal });
            snakeBestEl.textContent = t('snake_best', { n: snakeBest });
            snakeToggleBtn.textContent = snakeState === 'running' ? t('snake_pause')
                                       : snakeState === 'paused' ? t('snake_resume')
                                       : snakeState === 'over' ? t('snake_restart')
                                       : t('snake_start');
        }

        function placeSnakeFood() {
            var free = [];
            var x, y, k, used;
            for (y = 0; y < SNAKE_GRID; y++) {
                for (x = 0; x < SNAKE_GRID; x++) {
                    used = false;
                    for (k = 0; k < snake.length; k++) {
                        if (snake[k].x === x && snake[k].y === y) { used = true; break; }
                    }
                    if (!used) free.push({ x: x, y: y });
                }
            }
            if (!free.length) return false;
            snakeFood = free[Math.floor(Math.random() * free.length)];
            return true;
        }

        function resetSnake() {
            if (snakeTimer) { clearTimeout(snakeTimer); snakeTimer = null; }
            snake = [{ x: 7, y: 7 }, { x: 6, y: 7 }, { x: 5, y: 7 }];
            snakeDir = { x: 1, y: 0 };
            snakeQueue = [];
            snakeScoreVal = 0;
            snakeEndKey = 'snake_over';
            snakeState = 'idle';
            placeSnakeFood();
            updateSnakeUI();
            drawSnake();
        }

        function snakeSpeed() {
            return Math.max(70, 150 - snakeScoreVal * 3);
        }

        function startSnake() {
            snakeState = 'running';
            updateSnakeUI();
            drawSnake();
            snakeTimer = setTimeout(snakeTick, snakeSpeed());
        }

        function pauseSnake() {
            if (snakeState !== 'running') return;
            if (snakeTimer) { clearTimeout(snakeTimer); snakeTimer = null; }
            snakeState = 'paused';
            updateSnakeUI();
            drawSnake();
        }

        function endSnake(win) {
            if (snakeTimer) { clearTimeout(snakeTimer); snakeTimer = null; }
            snakeState = 'over';
            snakeEndKey = win ? 'snake_win' : 'snake_over';
            updateSnakeUI();
            drawSnake();
        }

        function snakeHits(head, eating) {
            var n = eating ? snake.length : snake.length - 1;  /* 没吃到时尾巴会让出格子 */
            for (var i = 0; i < n; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) return true;
            }
            return false;
        }

        function snakeTick() {
            snakeTimer = null;
            if (snakeState !== 'running') return;
            if (snakeQueue.length) snakeDir = snakeQueue.shift();

            var head = { x: snake[0].x + snakeDir.x, y: snake[0].y + snakeDir.y };
            var eating = head.x === snakeFood.x && head.y === snakeFood.y;

            if (head.x < 0 || head.y < 0 || head.x >= SNAKE_GRID || head.y >= SNAKE_GRID ||
                snakeHits(head, eating)) {
                endSnake(false);
                return;
            }

            snake.unshift(head);
            if (eating) {
                snakeScoreVal++;
                if (snakeScoreVal > snakeBest) {
                    snakeBest = snakeScoreVal;
                    safeSet('snakeBest', String(snakeBest));
                }
                if (!placeSnakeFood()) {
                    updateSnakeUI();
                    endSnake(true);
                    return;
                }
            } else {
                snake.pop();
            }
            updateSnakeUI();
            drawSnake();
            snakeTimer = setTimeout(snakeTick, snakeSpeed());
        }

        function setSnakeDir(dx, dy) {
            if (snakeState === 'over' || snakeState === 'paused') return;
            if (snakeState === 'idle') {
                if (dx === -snakeDir.x && dy === -snakeDir.y) return;  /* 开局不能立刻掉头 */
                snakeDir = { x: dx, y: dy };
                startSnake();
                return;
            }
            var last = snakeQueue.length ? snakeQueue[snakeQueue.length - 1] : snakeDir;
            if (dx === last.x && dy === last.y) return;
            if (dx === -last.x && dy === -last.y) return;
            if (snakeQueue.length < 2) snakeQueue.push({ x: dx, y: dy });
        }

        function toggleSnake() {
            if (snakeState === 'running') {
                pauseSnake();
            } else if (snakeState === 'over') {
                resetSnake();
                startSnake();
            } else {
                startSnake();   /* idle 或 paused */
            }
        }

        function openSnake() {
            lastFocused = document.activeElement;
            resetSnake();
            snakeOverlay.classList.add('show');
            snakeToggleBtn.focus();
        }
        function closeSnake() {
            resetSnake();
            snakeOverlay.classList.remove('show');
            if (lastFocused && lastFocused.focus) lastFocused.focus();
        }

        var SNAKE_KEYS = {
            ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
            w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
            W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0]
        };

        document.addEventListener('keydown', function (e) {
            if (!snakeOverlay.classList.contains('show')) return;
            if (e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault();
                if (!e.repeat) toggleSnake();
                return;
            }
            var d = SNAKE_KEYS[e.key];
            if (d) {
                e.preventDefault();
                setSnakeDir(d[0], d[1]);
            }
        });
        document.addEventListener('keyup', function (e) {
            /* 避免空格同时触发按钮的点击 */
            if (snakeOverlay.classList.contains('show') && (e.key === ' ' || e.key === 'Spacebar')) {
                e.preventDefault();
            }
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && snakeOverlay.classList.contains('show')) closeSnake();
        });
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) pauseSnake();
        });

        /* 触屏:方向键 + 画面上滑动 */
        var SNAKE_PAD = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
        document.getElementById('snakePad').addEventListener('click', function (e) {
            var btn = e.target.closest('button[data-d]');
            if (!btn) return;
            var d = SNAKE_PAD[btn.getAttribute('data-d')];
            setSnakeDir(d[0], d[1]);
        });

        var swipeX = 0, swipeY = 0;
        snakeCanvas.addEventListener('touchstart', function (e) {
            var t = e.changedTouches[0];
            swipeX = t.clientX;
            swipeY = t.clientY;
        }, { passive: true });
        snakeCanvas.addEventListener('touchend', function (e) {
            var t = e.changedTouches[0];
            var dx = t.clientX - swipeX;
            var dy = t.clientY - swipeY;
            if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
            if (Math.abs(dx) > Math.abs(dy)) setSnakeDir(dx > 0 ? 1 : -1, 0);
            else setSnakeDir(0, dy > 0 ? 1 : -1);
        }, { passive: true });

        snakeToggleBtn.addEventListener('click', toggleSnake);
        document.getElementById('snakeClose').addEventListener('click', closeSnake);
        document.getElementById('snakeBtn').addEventListener('click', openSnake);
        resetSnake();

        /* ================= 石头剪刀布 ================= */
        var RPS = [
            { e: '✊', n: '石头' },
            { e: '✌️', n: '剪刀' },
            { e: '✋', n: '布' }
        ];
        var rpsOverlay = document.getElementById('rpsOverlay');
        var rpsTitle   = document.getElementById('rpsTitle');
        var rpsStage   = document.getElementById('rpsStage');
        var rpsHint    = document.getElementById('rpsHint');
        var rpsScore   = document.getElementById('rpsScore');
        var rpsChoices = document.getElementById('rpsChoices');
        var rpsAgain   = document.getElementById('rpsAgain');
        var rpsMode = 'bot';      /* 'bot' 对战机器人 | 'duo' 面对面 */
        var rpsStep = 'p1';       /* 'p1' | 'p2' | 'result' */
        var rpsP1 = null;
        var rpsScores = {
            bot: { a: 0, b: 0, d: 0 },
            duo: { a: 0, b: 0, d: 0 }
        };

        /* 0 平局,1 前者赢,2 后者赢(0 石头 / 1 剪刀 / 2 布) */
        function rpsWinner(a, b) {
            if (a === b) return 0;
            return ((a - b + 3) % 3 === 2) ? 1 : 2;
        }

        function rpsName(i) {
            return t(['rps_rock', 'rps_scissors', 'rps_paper'][i]);
        }

        function rpsNames() {
            return rpsMode === 'duo' ? [t('rps_p1'), t('rps_p2')] : [t('rps_you'), t('rps_bot')];
        }

        function renderRpsScore() {
            var sc = rpsScores[rpsMode];
            var nm = rpsNames();
            rpsScore.textContent = t('rps_score', { a: nm[0], x: sc.a, y: sc.b, b: nm[1], d: sc.d });
        }

        function setRpsStep(step) {
            var duo = rpsMode === 'duo';
            rpsStep = step;
            rpsTitle.textContent = t(duo ? 'rps_title_duo' : 'rps_title_bot');
            if (step === 'p1') {
                rpsStage.textContent = '❔';
                rpsHint.textContent = t(duo ? 'rps_hint_p1' : 'rps_hint_bot');
            } else if (step === 'p2') {
                rpsStage.textContent = '🙈';
                rpsHint.textContent = t('rps_hint_p2');
            }
            rpsChoices.hidden = false;
            rpsAgain.hidden = true;
            renderRpsScore();
        }

        function showRpsResult(a, b) {
            var duo = rpsMode === 'duo';
            var sc = rpsScores[rpsMode];
            var winKeys = duo ? ['rps_win_p1', 'rps_win_p2'] : ['rps_win_you', 'rps_win_bot'];
            var w = rpsWinner(a, b);
            if (w === 1) sc.a++; else if (w === 2) sc.b++; else sc.d++;
            rpsStep = 'result';
            rpsStage.textContent = RPS[a].e + '  vs  ' + RPS[b].e;
            rpsHint.textContent = t('rps_vs', { A: rpsName(a), B: rpsName(b) }) +
                (w === 0 ? t('rps_draw') : t(winKeys[w - 1]));
            if (duo) {
                rpsChoices.hidden = true;
                rpsAgain.hidden = false;
                rpsAgain.focus();
            }
            renderRpsScore();
        }

        function openRps(mode) {
            rpsMode = mode;
            rpsP1 = null;
            setRpsStep('p1');
            lastFocused = document.activeElement;
            rpsOverlay.classList.add('show');
            rpsChoices.querySelector('button').focus();
        }
        function closeRps() {
            rpsOverlay.classList.remove('show');
            rpsP1 = null;
            if (lastFocused && lastFocused.focus) lastFocused.focus();
        }

        rpsChoices.addEventListener('click', function (e) {
            var btn = e.target.closest('button[data-i]');
            if (!btn) return;
            var i = parseInt(btn.getAttribute('data-i'), 10);
            if (rpsMode === 'bot') {
                showRpsResult(i, randInt(0, 2));
            } else if (rpsStep === 'p1') {
                rpsP1 = i;
                setRpsStep('p2');
            } else if (rpsStep === 'p2') {
                showRpsResult(rpsP1, i);
                rpsP1 = null;
            }
        });

        rpsAgain.addEventListener('click', function () {
            rpsP1 = null;
            setRpsStep('p1');
            rpsChoices.querySelector('button').focus();
        });
        document.getElementById('rpsReset').addEventListener('click', function () {
            rpsScores[rpsMode] = { a: 0, b: 0, d: 0 };
            rpsP1 = null;
            setRpsStep('p1');
        });
        document.getElementById('rpsClose').addEventListener('click', closeRps);
        rpsOverlay.addEventListener('click', function (e) {
            if (e.target === rpsOverlay) closeRps();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && rpsOverlay.classList.contains('show')) closeRps();
        });
        document.getElementById('rpsBotBtn').addEventListener('click', function () { openRps('bot'); });
        document.getElementById('rpsDuoBtn').addEventListener('click', function () { openRps('duo'); });

        /* ================= 倒计时(用户自定义日期) ================= */
        var CD_KEY = 'countdown';
        var cdOverlay = document.getElementById('cdOverlay');
        var cdResult  = document.getElementById('cdResult');
        var cdName    = document.getElementById('cdName');
        var cdDate    = document.getElementById('cdDate');
        var cdBtn     = document.getElementById('countdownBtn');
        var cdLabel   = cdBtn.querySelector('.label');

        function loadCd() {
            try {
                var v = JSON.parse(safeGet(CD_KEY));
                if (v && v.date) return v;
            } catch (e) {}
            return null;
        }
        function saveCd(v) {
            try { localStorage.setItem(CD_KEY, JSON.stringify(v)); } catch (e) {}
        }
        function removeCd() {
            try { localStorage.removeItem(CD_KEY); } catch (e) {}
        }

        function daysLeft(dateStr) {
            var p = dateStr.split('-');
            var target = new Date(+p[0], +p[1] - 1, +p[2]);
            var now = new Date();
            var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            return Math.round((target - today) / 86400000);
        }

        function cdDisplayName(cd) {
            return cd.name || t('cd_default_name');
        }

        function describeCd(cd) {
            var days = daysLeft(cd.date);
            var name = cdDisplayName(cd);
            if (days > 0)   return t(days === 1 ? 'cd_left_one' : 'cd_left', { name: name, n: days });
            if (days === 0) return t('cd_today', { name: name });
            return t(days === -1 ? 'cd_past_one' : 'cd_past', { name: name, n: -days });
        }

        function renderCd() {
            var cd = loadCd();
            if (!cd) {
                cdLabel.textContent = t('cd_title');
                cdResult.textContent = t('cd_none');
                return;
            }
            var days = daysLeft(cd.date);
            var name = cdDisplayName(cd);
            cdLabel.textContent = days > 0 ? t('cd_label_days', { name: name, n: days })
                                : days === 0 ? t('cd_label_today', { name: name })
                                : t('cd_title');
            cdResult.textContent = describeCd(cd);
        }

        function openCd() {
            var cd = loadCd();
            cdName.value = cd ? cd.name : '';
            cdDate.value = cd ? cd.date : '';
            renderCd();
            lastFocused = document.activeElement;
            cdOverlay.classList.add('show');
            (cd ? document.getElementById('cdClose') : cdDate).focus();
        }
        function closeCd() {
            cdOverlay.classList.remove('show');
            if (lastFocused && lastFocused.focus) lastFocused.focus();
        }

        cdBtn.addEventListener('click', openCd);
        document.getElementById('cdClose').addEventListener('click', closeCd);
        cdOverlay.addEventListener('click', function (e) {
            if (e.target === cdOverlay) closeCd();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && cdOverlay.classList.contains('show')) closeCd();
        });

        document.getElementById('cdSave').addEventListener('click', function () {
            if (!cdDate.value) {
                cdResult.textContent = t('cd_need_date');
                cdDate.focus();
                return;
            }
            saveCd({ name: cdName.value.trim(), date: cdDate.value });
            renderCd();
        });
        document.getElementById('cdClear').addEventListener('click', function () {
            removeCd();
            cdName.value = '';
            cdDate.value = '';
            renderCd();
        });

        renderCd();

        /* ================= 一键写完作业（假的） ================= */
        document.getElementById('homeworkBtn').addEventListener('click', function () {
            showToast('🚀', t('hw_title'), t('hw_msg'));
        });

        /* ================= 鼠标跟随光点 ================= */
        var dot = document.createElement('div');
        dot.className = 'cursor-dot';
        document.body.appendChild(dot);

        if (hasPointer && !reduceMotion) {
            document.addEventListener('mousemove', function (e) {
                dot.style.left = e.clientX + 'px';
                dot.style.top = e.clientY + 'px';
                dot.style.opacity = '1';
            });
            document.documentElement.addEventListener('mouseleave', function () {
                dot.style.opacity = '0';
            });
        } else {
            dot.style.display = 'none';
        }

        /* ================= 长按鼠标 → 连续爆星星拖尾 ================= */
        (function () {
            if (reduceMotion || !hasPointer) return;

            var starChars = ['✦', '✧', '★', '✶', '✷', '✨', '⭐', '💫', '🌟'];

            var isDown = false;
            var lastX = 0, lastY = 0;
            var lastTime = 0;

            var MIN_DIST = 10;
            var MIN_INTERVAL = 30;

            function spawnStar(x, y) {
                var star = document.createElement('span');
                star.className = 'star-trail';
                star.textContent = starChars[Math.floor(Math.random() * starChars.length)];

                if (document.body.classList.contains('light-mode')) {
                    star.style.color = '#c9a86a';
                    star.style.textShadow = '0 0 6px rgba(184,144,74,0.6)';
                } else {
                    star.style.color = '#60a5fa';
                    star.style.textShadow = '0 0 6px rgba(59,130,246,0.6)';
                }

                var size = 0.8 + Math.random() * 0.7;
                star.style.fontSize = size + 'rem';

                var ox = (Math.random() - 0.5) * 12;
                var oy = (Math.random() - 0.5) * 12;
                star.style.left = (x + ox) + 'px';
                star.style.top  = (y + oy) + 'px';

                document.body.appendChild(star);
                setTimeout(function () { star.remove(); }, 1000);
            }

            document.addEventListener('mousedown', function (e) {
                if (e.button !== 0) return;
                isDown = true;
                lastX = e.clientX;
                lastY = e.clientY;
                lastTime = Date.now();
                spawnStar(e.clientX, e.clientY);
            });

            document.addEventListener('mouseup', function () {
                isDown = false;
            });

            document.addEventListener('mousemove', function (e) {
                if (!isDown) return;

                var now = Date.now();
                var x = e.clientX, y = e.clientY;
                var dx = x - lastX;
                var dy = y - lastY;
                var dist = Math.sqrt(dx * dx + dy * dy);

                if (dist >= MIN_DIST && (now - lastTime) >= MIN_INTERVAL) {
                    spawnStar(x, y);
                    lastX = x;
                    lastY = y;
                    lastTime = now;
                }
            });

            document.documentElement.addEventListener('mouseleave', function () {
                isDown = false;
            });
        })();

        applyLang();

        /* ================= 卡片入场 ================= */
        var items  = Array.prototype.slice.call(document.querySelectorAll('.link-item'));
        var footer = document.querySelector('.footer-note');

        items.forEach(function (el, i) {
            el.style.setProperty('--delay', (i * 0.05) + 's');
        });

        function reveal(el) { el.classList.add('is-visible'); }

        if (reduceMotion || !('IntersectionObserver' in window)) {
            items.forEach(reveal);
            if (footer) reveal(footer);
        } else {
            var io = new IntersectionObserver(function (entries, observer) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        reveal(entry.target);
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
            items.forEach(function (el) { io.observe(el); });

            if (footer) {
                var footerIO = new IntersectionObserver(function (entries, observer) {
                    entries.forEach(function (entry) {
                        if (entry.isIntersecting) {
                            reveal(entry.target);
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1 });
                footerIO.observe(footer);
            }
        }
    })();
    </script>
</body>
</html>
