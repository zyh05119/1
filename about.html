<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于冷涩调</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0a0a0a;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            color: #eaeaea;
            display: flex;
            flex-direction: column;
            padding: 3rem 2rem;
            position: relative;
            transition: background-color 0.4s ease, color 0.3s ease;
        }

        body.light-mode {
            background-color: #f5f0e6;
            color: #3a3528;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.008) 1px, transparent 1px),
                radial-gradient(circle at 70% 60%, rgba(255,255,255,0.006) 1px, transparent 1px),
                radial-gradient(circle at 40% 80%, rgba(255,255,255,0.005) 1px, transparent 1px),
                radial-gradient(circle at 90% 20%, rgba(255,255,255,0.007) 1px, transparent 1px);
            background-size: 200px 200px, 150px 150px, 180px 180px, 220px 220px;
        }
        body.light-mode::after {
            background-image:
                radial-gradient(circle at 20% 30%, rgba(120, 100, 70, 0.025) 1px, transparent 1px),
                radial-gradient(circle at 70% 60%, rgba(120, 100, 70, 0.018) 1px, transparent 1px),
                radial-gradient(circle at 40% 80%, rgba(120, 100, 70, 0.014) 1px, transparent 1px),
                radial-gradient(circle at 90% 20%, rgba(120, 100, 70, 0.020) 1px, transparent 1px);
        }

        .about-wrap { max-width: 680px; width: 100%; margin: 0 auto; position: relative; z-index: 1; }

        .back {
            display: inline-block;
            font-size: 0.8rem;
            color: #6b7280;
            text-decoration: none;
            margin-bottom: 2.5rem;
            transition: color 0.15s;
        }
        .back:hover { color: #60a5fa; }
        body.light-mode .back { color: #a89b82; }
        body.light-mode .back:hover { color: #b8904a; }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            color: #ffffff;
            margin-bottom: 0.4rem;
            transition: color 0.3s ease;
        }
        body.light-mode h1 { color: #2a2418; }

        .sub {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 2.5rem;
            transition: color 0.3s ease;
        }
        body.light-mode .sub { color: #8a7f68; }

        .section { margin-bottom: 2rem; }

        .section h2 {
            font-size: 0.8rem;
            font-weight: 600;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.8rem;
            transition: color 0.3s ease;
        }
        body.light-mode .section h2 { color: #b8904a; }

        .section p {
            font-size: 0.95rem;
            line-height: 1.8;
            color: #b4b4bb;
            transition: color 0.3s ease;
        }
        body.light-mode .section p { color: #5a5040; }
        .section p + p { margin-top: 0.8rem; }

        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: #3f3f46;
            margin-top: 3rem;
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }
        body.light-mode .footer-note { color: #a89b82; }

        /* ===== 主题切换 ===== */
        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 100;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(60, 110, 120, 0.08);
            background: rgba(10, 18, 20, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #c8a85a;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .theme-toggle:hover {
            transform: scale(1.05);
            border-color: rgba(200, 180, 100, 0.15);
            background: rgba(10, 18, 20, 0.5);
            box-shadow: 0 0 20px rgba(200, 180, 80, 0.06);
        }
        .theme-toggle:active { transform: scale(0.92); }
        .theme-toggle:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }

        body.light-mode .theme-toggle {
            background: rgba(255, 250, 240, 0.8);
            border-color: rgba(180, 150, 100, 0.25);
            color: #a8863a;
        }
        body.light-mode .theme-toggle:hover {
            background: rgba(255, 250, 240, 0.95);
            border-color: rgba(180, 150, 100, 0.4);
            box-shadow: 0 0 20px rgba(180, 150, 80, 0.12);
        }

        /* ===== 语言切换 ===== */
        .lang-toggle {
            right: 60px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            font-family: inherit;
        }

        /* ===== 天气 ===== */
        .weather-corner {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(10, 18, 20, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(60, 110, 120, 0.06);
            border-radius: 30px;
            padding: 6px 16px 6px 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: rgba(200, 220, 225, 0.55);
            letter-spacing: 0.5px;
            user-select: none;
            pointer-events: none;
            white-space: nowrap;
            transition: background 0.3s, border-color 0.3s, color 0.3s;
        }
        body.light-mode .weather-corner {
            background: rgba(255, 250, 240, 0.8);
            border-color: rgba(180, 150, 100, 0.20);
            color: rgba(120, 100, 70, 0.75);
            box-shadow: 0 4px 20px rgba(120, 100, 60, 0.08);
        }
        .weather-corner .w-icon { font-size: 0.9rem; line-height: 1; }
        .weather-corner .w-temp { font-weight: 400; color: rgba(200, 220, 225, 0.7); }
        body.light-mode .weather-corner .w-temp { color: rgba(120, 100, 70, 0.9); }
        .weather-corner .w-city {
            font-size: 0.6rem;
            opacity: 0.55;
            max-width: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        body.light-mode .weather-corner .w-city { opacity: 0.7; }

        @media (max-width: 600px) {
            body { padding: 2rem 1.25rem; }
            h1 { font-size: 1.8rem; }
            .theme-toggle { top: 12px; right: 12px; width: 32px; height: 32px; font-size: 0.8rem; }
            .lang-toggle { right: 52px; font-size: 0.65rem; }
            .weather-corner { bottom: 14px; right: 14px; padding: 5px 12px 5px 10px; font-size: 0.68rem; }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" id="themeToggle" type="button" data-i18n-aria="aria_theme" aria-label="切换黑白模式">✦</button>
    <button class="theme-toggle lang-toggle" id="langToggle" type="button" data-i18n-aria="aria_lang" aria-label="切换语言">EN</button>

    <div class="weather-corner" id="weatherCorner">
        <span class="w-icon" id="weatherIcon">🌤</span>
        <span class="w-temp" id="weatherTemp">--°</span>
        <span class="w-city" id="weatherCity">--</span>
    </div>

    <div class="about-wrap">
        <a href="index.html" class="back" data-i18n="ab_back">← 返回工具集</a>

        <h1 data-i18n="brand">冷涩调</h1>
        <p class="sub" data-i18n="ab_sub">P5G的一个乐乐</p>

        <div class="section">
            <h2>about me</h2>
            <p data-i18n="ab_p1">
                哈喽这里是冷涩调，一个喜欢二次元和音乐的妹子。
                平时最大的爱好就是追番，特别宅呀。
            </p>
            <p data-i18n="ab_p2">
                音乐方面，我特别喜欢 Ariana、杨丞琳，种类的话呢我什么都会听一点，
                R&amp;B、Britpop 什么的最好了。还有就是游戏，第五人格、王者荣耀、和平精英、
                无畏契约、金铲铲、原神、1999、崩铁、鸣潮什么的我都玩过。
            </p>
        </div>

        <div class="footer-note" data-i18n="ab_footer">天天开心 大家</div>
    </div>

    <script>
    (function () {
        'use strict';

        /* localStorage 在隐私模式下可能抛错，统一包一层 */
        function safeGet(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function safeSet(key, val) {
            try { localStorage.setItem(key, val); } catch (e) {}
        }

        /* ================= 多语言（与 index / feedback 共用 lang 键） ================= */
        var I18N = {
            zh: {
                brand: '冷涩调',
                aria_theme: '切换黑白模式',
                aria_lang: '切换语言',
                ab_doc_title: '关于冷涩调',
                ab_back: '← 返回工具集',
                ab_sub: 'P5G的一个乐乐',
                ab_p1: '哈喽这里是冷涩调，一个喜欢二次元和音乐的妹子。平时最大的爱好就是追番，特别宅呀。',
                ab_p2: '音乐方面，我特别喜欢 Ariana、杨丞琳，种类的话呢我什么都会听一点，R&B、Britpop 什么的最好了。还有就是游戏，第五人格、王者荣耀、和平精英、无畏契约、金铲铲、原神、1999、崩铁、鸣潮什么的我都玩过。',
                ab_footer: '天天开心 大家'
            },
            en: {
                brand: 'idk how to translate this',
                aria_theme: 'Toggle light/dark theme',
                aria_lang: 'Switch language',
                ab_doc_title: 'About',
                ab_back: '← Back to tools',
                ab_sub: 'a happy soul from P5G',
                ab_p1: 'Hi, this is 冷涩调...So I\'m a girl whos obsessed with anime and music, and yeah i love animes.',
                ab_p2: 'abt games, I\'ve dabbled in basically everything: Identity V, Honor of Kings, Peacekeeper Elite, Valorant, Golden Spatula, Genshin Impact, Reverse: 1999, Honkai: Star Rail, Wuthering Waves... so yeah thats me, a random person who made this site',
                ab_footer: 'Have a good day, guys'
            }
        };

        var lang = safeGet('lang') === 'en' ? 'en' : 'zh';
        var langToggle = document.getElementById('langToggle');
        var toggleBtn = document.getElementById('themeToggle');

        /* 元素缺失时直接提示，避免后续 null 报错 */
        if (!langToggle || !toggleBtn) {
            console.error('按钮元素未找到，检查 id 是否为 langToggle / themeToggle');
            return;
        }

        function t(key, vars) {
            var d = I18N[lang];
            var str = (d && d[key] !== undefined) ? d[key]
                    : (I18N.zh[key] !== undefined ? I18N.zh[key] : key);
            if (vars) {
                for (var k in vars) {
                    if (Object.prototype.hasOwnProperty.call(vars, k)) {
                        str = str.split('{' + k + '}').join(vars[k]);
                    }
                }
            }
            return str;
        }

        function applyLang() {
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
            document.title = t('ab_doc_title');
            Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
                el.textContent = t(el.getAttribute('data-i18n'));
            });
            Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-ph]'), function (el) {
                el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph')));
            });
            Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-aria]'), function (el) {
                el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria')));
            });
            langToggle.textContent = lang === 'zh' ? 'EN' : '中';
        }

        /* ================= 语言按钮 ================= */
        langToggle.addEventListener('click', function (e) {
            e.preventDefault();
            lang = lang === 'zh' ? 'en' : 'zh';
            safeSet('lang', lang);
            applyLang();
        });

        /* ================= 主题切换 ================= */
        var isLight = safeGet('theme') === 'light';

        function applyTheme() {
            if (isLight) {
                document.body.classList.add('light-mode');
                toggleBtn.textContent = '☀';
            } else {
                document.body.classList.remove('light-mode');
                toggleBtn.textContent = '✦';
            }
        }

        applyTheme();

        toggleBtn.addEventListener('click', function (e) {
            e.preventDefault();
            isLight = !isLight;
            safeSet('theme', isLight ? 'light' : 'dark');
            applyTheme();
        });

        /* ================= 天气 ================= */
        function getWeather() {
            var tempEl = document.getElementById('weatherTemp');
            var cityEl = document.getElementById('weatherCity');
            var iconEl = document.getElementById('weatherIcon');
            if (!tempEl || !cityEl || !iconEl) return;

            if (typeof fetch !== 'function') return;

            var controller = new AbortController();
            var timeoutId = setTimeout(function () { controller.abort(); }, 6000);

            fetch('https://wttr.in?format=j1&lang=zh', { signal: controller.signal })
                .then(function (res) {
                    clearTimeout(timeoutId);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function (data) {
                    var current = data.current_condition && data.current_condition[0];
                    if (!current) return;

                    var temp = current.temp_C;
                    var code = current.weatherCode;
                    var city = (data.nearest_area && data.nearest_area[0] &&
                                data.nearest_area[0].areaName &&
                                data.nearest_area[0].areaName[0].value) || '--';

                    var iconMap = {
                        '113': '☀️', '116': '🌤', '119': '⛅', '122': '☁️',
                        '143': '🌫', '176': '🌦', '179': '🌨', '182': '🌧',
                        '185': '🌧', '200': '⛈', '227': '❄️', '230': '❄️',
                        '248': '🌫', '260': '🌫', '263': '🌦', '266': '🌧',
                        '281': '🌧', '284': '🌧', '293': '🌦', '296': '🌧',
                        '299': '🌧', '302': '🌧', '305': '🌧', '308': '🌧',
                        '311': '🌧', '314': '🌧', '317': '🌧', '320': '🌨',
                        '323': '🌨', '326': '🌨', '329': '🌨', '332': '❄️',
                        '335': '❄️', '338': '❄️', '350': '🌧', '353': '🌦',
                        '356': '🌧', '359': '🌧', '362': '🌧', '365': '🌧',
                        '368': '🌨', '371': '🌨', '374': '🌧', '377': '🌧',
                        '386': '⛈', '389': '⛈', '392': '🌨', '395': '❄️'
                    };

                    iconEl.textContent = iconMap[code] || '🌤';
                    tempEl.textContent = temp + '°';
                    cityEl.textContent = city.length > 6 ? city.slice(0, 6) : city;
                })
                .catch(function () { clearTimeout(timeoutId); });
        }

        try { getWeather(); } catch (e) { /* 天气失败不影响按钮 */ }

        /* 初始化语言 */
        applyLang();
    })();
    </script>
</body>
</html>
