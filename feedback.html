<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反馈区</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0a0a0a;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            color: #eaeaea;
            display: flex;
            flex-direction: column;
            padding: 3rem 2rem;
            position: relative;
            transition: background-color 0.4s ease, color 0.3s ease;
        }

        body.light-mode {
            background-color: #f5f0e6;
            color: #3a3528;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.008) 1px, transparent 1px),
                radial-gradient(circle at 70% 60%, rgba(255,255,255,0.006) 1px, transparent 1px),
                radial-gradient(circle at 40% 80%, rgba(255,255,255,0.005) 1px, transparent 1px),
                radial-gradient(circle at 90% 20%, rgba(255,255,255,0.007) 1px, transparent 1px);
            background-size: 200px 200px, 150px 150px, 180px 180px, 220px 220px;
        }
        body.light-mode::after {
            background-image:
                radial-gradient(circle at 20% 30%, rgba(120, 100, 70, 0.025) 1px, transparent 1px),
                radial-gradient(circle at 70% 60%, rgba(120, 100, 70, 0.018) 1px, transparent 1px),
                radial-gradient(circle at 40% 80%, rgba(120, 100, 70, 0.014) 1px, transparent 1px),
                radial-gradient(circle at 90% 20%, rgba(120, 100, 70, 0.020) 1px, transparent 1px);
        }

        .wrap { max-width: 680px; width: 100%; margin: 0 auto; position: relative; z-index: 1; }

        .back {
            display: inline-block;
            font-size: 0.8rem;
            color: #6b7280;
            text-decoration: none;
            margin-bottom: 2.5rem;
            transition: color 0.15s;
        }
        .back:hover { color: #60a5fa; }
        body.light-mode .back { color: #a89b82; }
        body.light-mode .back:hover { color: #b8904a; }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            color: #ffffff;
            margin-bottom: 0.4rem;
            transition: color 0.3s ease;
        }
        body.light-mode h1 { color: #2a2418; }

        .sub {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 2.5rem;
            transition: color 0.3s ease;
        }
        body.light-mode .sub { color: #8a7f68; }

        .section { margin-bottom: 2rem; }

        .section h2 {
            font-size: 0.8rem;
            font-weight: 600;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.8rem;
            scroll-margin-top: 2rem;
            transition: color 0.3s ease;
        }
        body.light-mode .section h2 { color: #b8904a; }

        .section p {
            font-size: 0.95rem;
            line-height: 1.8;
            color: #b4b4bb;
            transition: color 0.3s ease;
        }
        body.light-mode .section p { color: #5a5040; }
        .section p + p { margin-top: 0.8rem; }

        .section a {
            color: #60a5fa;
            text-decoration: none;
        }
        .section a:hover { text-decoration: underline; }
        body.light-mode .section a { color: #b8904a; }

        .contact-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .contact-list a {
            color: #d4d4d8;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.15s;
        }
        .contact-list a:hover { color: #60a5fa; }
        body.light-mode .contact-list a { color: #4a4232; }
        body.light-mode .contact-list a:hover { color: #b8904a; }

        .divider-line {
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, #2e2e2e, transparent);
            margin: 2.5rem 0;
        }
        body.light-mode .divider-line {
            background: linear-gradient(to right, #d8cfba, transparent);
        }

        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: #3f3f46;
            margin-top: 3rem;
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }
        body.light-mode .footer-note { color: #a89b82; }

        /* ===== 主题切换 ===== */
        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 100;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(60, 110, 120, 0.08);
            background: rgba(10, 18, 20, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #c8a85a;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .theme-toggle:hover {
            transform: scale(1.05);
            border-color: rgba(200, 180, 100, 0.15);
            background: rgba(10, 18, 20, 0.5);
            box-shadow: 0 0 20px rgba(200, 180, 80, 0.06);
        }
        .theme-toggle:active { transform: scale(0.92); }
        .theme-toggle:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }

        body.light-mode .theme-toggle {
            background: rgba(255, 250, 240, 0.8);
            border-color: rgba(180, 150, 100, 0.25);
            color: #a8863a;
        }
        body.light-mode .theme-toggle:hover {
            background: rgba(255, 250, 240, 0.95);
            border-color: rgba(180, 150, 100, 0.4);
            box-shadow: 0 0 20px rgba(180, 150, 80, 0.12);
        }

        /* ===== 语言切换 ===== */
        .lang-toggle {
            right: 60px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            font-family: inherit;
        }

        /* ===== 天气 ===== */
        .weather-corner {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(10, 18, 20, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(60, 110, 120, 0.06);
            border-radius: 30px;
            padding: 6px 16px 6px 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: rgba(200, 220, 225, 0.55);
            letter-spacing: 0.5px;
            user-select: none;
            pointer-events: none;
            white-space: nowrap;
            transition: background 0.3s, border-color 0.3s, color 0.3s;
        }
        body.light-mode .weather-corner {
            background: rgba(255, 250, 240, 0.8);
            border-color: rgba(180, 150, 100, 0.20);
            color: rgba(120, 100, 70, 0.75);
            box-shadow: 0 4px 20px rgba(120, 100, 60, 0.08);
        }
        .weather-corner .w-icon { font-size: 0.9rem; line-height: 1; }
        .weather-corner .w-temp { font-weight: 400; color: rgba(200, 220, 225, 0.7); }
        body.light-mode .weather-corner .w-temp { color: rgba(120, 100, 70, 0.9); }
        .weather-corner .w-city {
            font-size: 0.6rem;
            opacity: 0.55;
            max-width: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        body.light-mode .weather-corner .w-city { opacity: 0.7; }

        @media (max-width: 600px) {
            body { padding: 2rem 1.25rem; }
            h1 { font-size: 1.8rem; }
            .theme-toggle { top: 12px; right: 12px; width: 32px; height: 32px; font-size: 0.8rem; }
            .lang-toggle { right: 52px; font-size: 0.65rem; }
            .weather-corner { bottom: 14px; right: 14px; padding: 5px 12px 5px 10px; font-size: 0.68rem; }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" id="themeToggle" type="button" data-i18n-aria="aria_theme" aria-label="切换黑白模式">✦</button>
    <button class="theme-toggle lang-toggle" id="langToggle" type="button" data-i18n-aria="aria_lang" aria-label="切换语言">EN</button>

    <div class="weather-corner" id="weatherCorner">
        <span class="w-icon" id="weatherIcon">🌤</span>
        <span class="w-temp" id="weatherTemp">--°</span>
        <span class="w-city" id="weatherCity">--</span>
    </div>

    <div class="wrap">
        <a href="index.html" class="back" data-i18n="fb_back">← 返回工具集</a>

        <h1 data-i18n="fb_title">反馈与联系</h1>
        <p class="sub" data-i18n="fb_sub">问题？建议？聊天？都可以</p>

        <div class="section" id="bug">
            <h2 data-i18n="fb_bug_h">报告问题</h2>
            <p>
                <span data-i18n="fb_bug_p1">链接打不开、功能异常、页面显示错乱？</span><br>
                <span data-i18n="fb_bug_p2">email </span><a href="mailto:zyh0197@gmail.com">zyh0197@gmail.com</a><span data-i18n="fb_bug_p3"> 即可。</span>
            </p>
        </div>

        <div class="section" id="suggest">
            <h2 data-i18n="fb_sug_h">工具建议</h2>
            <p>
                <span data-i18n="fb_sug_p1">想要什么新东西？觉得可以做得更好？ email </span><a href="mailto:zyh0197@gmail.com">zyh0197@gmail.com</a><span data-i18n="fb_sug_p2">，或者加 whatsapp </span><strong>81790196</strong><span data-i18n="fb_sug_p3">，我会认真看。</span>
            </p>
        </div>

        <div class="divider-line"></div>

        <div class="section" id="feedback">
            <h2 data-i18n="fb_contact_h">contact</h2>
            <ul class="contact-list">
                <li>
                    <a href="mailto:zyh0197@gmail.com">
                        <span aria-hidden="true">📧</span> zyh0197@gmail.com
                    </a>
                </li>
                <li>
                    <a href="https://github.com/Zain-1919" target="_blank" rel="noopener noreferrer">
                        <span aria-hidden="true">🐙</span> Zain-1919
                    </a>
                </li>
                <li>
                    <a href="javascript:void(0)" id="qq-copy" data-i18n-title="qq_copy_title" title="点击复制 QQ 号">
                        <span aria-hidden="true">💬</span> <span id="qq-text">81790196</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="footer-note" data-i18n="fb_footer">天天开心 大家</div>
    </div>

    <script>
    (function () {
        'use strict';

        /* localStorage 在隐私模式下可能抛错，统一包一层 */
        function safeGet(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function safeSet(key, val) {
            try { localStorage.setItem(key, val); } catch (e) {}
        }

        /* ================= 多语言（与 index 共用 lang 键） ================= */
        var I18N = {
            zh: {
                brand: '冷涩调',
                aria_theme: '切换黑白模式',
                aria_lang: '切换语言',
                fb_doc_title: '反馈区',
                fb_back: '← 返回工具集',
                fb_title: '反馈与联系',
                fb_sub: '问题？建议？聊天？都可以',
                fb_bug_h: '报告问题',
                fb_bug_p1: '链接打不开、功能异常、页面显示错乱？',
                fb_bug_p2: 'email ',
                fb_bug_p3: ' 即可。',
                fb_sug_h: '工具建议',
                fb_sug_p1: '想要什么新东西？觉得可以做得更好？ email ',
                fb_sug_p2: '，或者加 whatsapp ',
                fb_sug_p3: '，我会认真看。',
                fb_contact_h: 'contact',
                qq_copy_title: '点击复制 QQ 号',
                qq_copied: '已复制！',
                qq_alert: 'QQ：81790196',
                fb_footer: '天天开心 大家'
            },
            en: {
                brand: 'idk how to translate this',
                aria_theme: 'Toggle light/dark theme',
                aria_lang: 'Switch language',
                fb_doc_title: 'Feedback',
                fb_back: '← Back to tools',
                fb_title: 'Feedback & Contact',
                fb_sub: 'Questions? Suggestions? Just want to chat? All fine.',
                fb_bug_h: 'Report a problem',
                fb_bug_p1: 'Broken link, weird behaviour, layout glitches?',
                fb_bug_p2: 'Just email ',
                fb_bug_p3: '.',
                fb_sug_h: 'Suggestions',
                fb_sug_p1: 'Want something new? Think it could be better? Email ',
                fb_sug_p2: ', or message me on WhatsApp at ',
                fb_sug_p3: '. I read everything.',
                fb_contact_h: 'contact',
                qq_copy_title: 'Click to copy QQ number',
                qq_copied: 'Copied!',
                qq_alert: 'QQ: 81790196',
                fb_footer: 'Have a good day, everyone'
            }
        };

        var lang = safeGet('lang') === 'en' ? 'en' : 'zh';
        var langToggle = document.getElementById('langToggle');

        function t(key, vars) {
            var d = I18N[lang];
            var str = (d && d[key] !== undefined) ? d[key]
                    : (I18N.zh[key] !== undefined ? I18N.zh[key] : key);
            if (vars) {
                for (var k in vars) {
                    if (Object.prototype.hasOwnProperty.call(vars, k)) {
                        str = str.split('{' + k + '}').join(vars[k]);
                    }
                }
            }
            return str;
        }

        function applyLang() {
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
            document.title = t('fb_doc_title');
            Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
                el.textContent = t(el.getAttribute('data-i18n'));
            });
            Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-ph]'), function (el) {
                el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph')));
            });
            Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-aria]'), function (el) {
                el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria')));
            });
            Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-title]'), function (el) {
                el.setAttribute('title', t(el.getAttribute('data-i18n-title')));
            });
            langToggle.textContent = lang === 'zh' ? 'EN' : '中';
        }

        langToggle.addEventListener('click', function () {
            lang = lang === 'zh' ? 'en' : 'zh';
            safeSet('lang', lang);
            applyLang();
        });

        /* ================= 主题切换（与 index 共用 theme 键） ================= */
        var toggleBtn = document.getElementById('themeToggle');
        var isLight = safeGet('theme') === 'light';

        if (isLight) {
            document.body.classList.add('light-mode');
            toggleBtn.textContent = '☀';
        }

        toggleBtn.addEventListener('click', function () {
            isLight = !isLight;
            if (isLight) {
                document.body.classList.add('light-mode');
                toggleBtn.textContent = '☀';
                safeSet('theme', 'light');
            } else {
                document.body.classList.remove('light-mode');
                toggleBtn.textContent = '✦';
                safeSet('theme', 'dark');
            }
        });

        /* ================= 天气 ================= */
        function getWeather() {
            var tempEl = document.getElementById('weatherTemp');
            var cityEl = document.getElementById('weatherCity');
            var iconEl = document.getElementById('weatherIcon');

            var controller = new AbortController();
            var timeoutId = setTimeout(function () { controller.abort(); }, 6000);

            fetch('https://wttr.in?format=j1&lang=zh', { signal: controller.signal })
                .then(function (res) {
                    clearTimeout(timeoutId);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function (data) {
                    var current = data.current_condition && data.current_condition[0];
                    if (!current) return;

                    var temp = current.temp_C;
                    var code = current.weatherCode;
                    var city = (data.nearest_area && data.nearest_area[0] &&
                                data.nearest_area[0].areaName &&
                                data.nearest_area[0].areaName[0].value) || '--';

                    var iconMap = {
                        '113': '☀️', '116': '🌤', '119': '⛅', '122': '☁️',
                        '143': '🌫', '176': '🌦', '179': '🌨', '182': '🌧',
                        '185': '🌧', '200': '⛈', '227': '❄️', '230': '❄️',
                        '248': '🌫', '260': '🌫', '263': '🌦', '266': '🌧',
                        '281': '🌧', '284': '🌧', '293': '🌦', '296': '🌧',
                        '299': '🌧', '302': '🌧', '305': '🌧', '308': '🌧',
                        '311': '🌧', '314': '🌧', '317': '🌧', '320': '🌨',
                        '323': '🌨', '326': '🌨', '329': '🌨', '332': '❄️',
                        '335': '❄️', '338': '❄️', '350': '🌧', '353': '🌦',
                        '356': '🌧', '359': '🌧', '362': '🌧', '365': '🌧',
                        '368': '🌨', '371': '🌨', '374': '🌧', '377': '🌧',
                        '386': '⛈', '389': '⛈', '392': '🌨', '395': '❄️'
                    };

                    iconEl.textContent = iconMap[code] || '🌤';
                    tempEl.textContent = temp + '°';
                    cityEl.textContent = city.length > 6 ? city.slice(0, 6) : city;
                })
                .catch(function () { clearTimeout(timeoutId); });
        }
        getWeather();

        /* ================= QQ 复制 ================= */
        var qq = document.getElementById('qq-copy');
        var qqText = document.getElementById('qq-text');
        if (qq) {
            qq.addEventListener('click', function (e) {
                e.preventDefault();
                var num = '81790196';
                function onCopied() {
                    qqText.textContent = t('qq_copied');
                    setTimeout(function () { qqText.textContent = num; }, 1200);
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(num).then(onCopied).catch(function () {
                        alert(t('qq_alert'));
                    });
                } else {
                    alert(t('qq_alert'));
                }
            });
        }

        /* 初始化语言（会把标题、按钮文字、页面文案一次性刷成当前语言） */
        applyLang();
    })();
    </script>
</body>
</html>
