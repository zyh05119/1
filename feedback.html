<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反馈问题？</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0a0a0a;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            color: #eaeaea;
            display: flex;
            flex-direction: column;
            padding: 3rem 2rem;
        }

        .wrap { max-width: 680px; width: 100%; margin: 0 auto; }

        .back {
            display: inline-block;
            font-size: 0.8rem;
            color: #6b7280;
            text-decoration: none;
            margin-bottom: 2.5rem;
            transition: color 0.15s;
        }
        .back:hover { color: #60a5fa; }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            color: #ffffff;
            margin-bottom: 0.4rem;
        }

        .sub { font-size: 0.9rem; color: #6b7280; margin-bottom: 2.5rem; }

        .section { margin-bottom: 2rem; }

        .section h2 {
            font-size: 0.8rem;
            font-weight: 600;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.8rem;
            scroll-margin-top: 2rem;
        }

        .section p {
            font-size: 0.95rem;
            line-height: 1.8;
            color: #b4b4bb;
        }
        .section p + p { margin-top: 0.8rem; }

        .section a {
            color: #60a5fa;
            text-decoration: none;
        }
        .section a:hover { text-decoration: underline; }

        .contact-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .contact-list a {
            color: #d4d4d8;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.15s;
        }
        .contact-list a:hover { color: #60a5fa; }

        .divider-line {
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, #2e2e2e, transparent);
            margin: 2.5rem 0;
        }

        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: #3f3f46;
            margin-top: 3rem;
            letter-spacing: 0.5px;
        }

        @media (max-width: 600px) {
            body { padding: 2rem 1.25rem; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <a href="index.html" class="back">← 返回工具集</a>

        <h1>反馈与联系</h1>
        <p class="sub">问题？建议？聊天？都可以</p>

        <!-- ===== 报告问题（首页 #bug 直达） ===== -->
        <div class="section" id="bug">
            <h2>报告问题</h2>
            <p>
                链接打不开、功能异常、页面显示错乱？<br>
                email<a href="mailto:zyh0197@gmail.com">zyh0197@gmail.com</a> 即可。
            </p>
        </div>

        <!-- ===== 工具建议（首页 #suggest 直达） ===== -->
        <div class="section" id="suggest">
            <h2>工具建议</h2>
            <p>
                想要什么新东西？觉得可以做得更好？
                <a href="mailto:zyh0197@gmail.com">zyh0197@gmail.com</a>，
                或者加 whatsapp <strong>81790196</strong>，我会认真看。
            </p>
        </div>

        <div class="divider-line"></div>

        <!-- ===== 联系方式（首页 #feedback 直达） ===== -->
        <div class="section" id="feedback">
            <h2>contact</h2>
            <ul class="contact-list">
                <li>
                    <a href="mailto:zyh0197@gmail.com">
                        <span aria-hidden="true">📧</span> zyh0197@gmail.com
                    </a>
                </li>
                <li>
                    <a href="https://github.com/Zain-1919" target="_blank" rel="noopener noreferrer">
                        <span aria-hidden="true">🐙</span> Zain-1919
                    </a>
                </li>
                <li>
                    <a href="javascript:void(0)" id="qq-copy" title="点击复制 QQ 号">
                        <span aria-hidden="true">💬</span> 81790196
                    </a>
                </li>
            </ul>
        </div>

        <div class="footer-note">
            天天开心 大家
        </div>
    </div>

    <script>
    (function () {
        var qq = document.getElementById('qq-copy');
        if (!qq) return;
        qq.addEventListener('click', function (e) {
            e.preventDefault();
            var num = '81790196';
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(num).then(function () {
                    var old = qq.textContent;
                    qq.textContent = '💬 已复制！';
                    setTimeout(function () { qq.textContent = old; }, 1200);
                }).catch(function () {
                    alert('QQ：' + num);
                });
            } else {
                alert('QQ：' + num);
            }
        });
    })();
    </script>
</body>
</html>
